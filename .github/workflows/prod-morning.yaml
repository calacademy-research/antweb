name: Production morning check

# Release gate check 10 (docs/runbook.md, "Production smoke run and morning check"). Every morning: did today's
# daily update on production (the 05:00 Pacific nightly sets) end without failing? Reads dailyUpdate.do?format=json,
# READ-ONLY (one GET, no sign-in; tests/unit/test_smoke_read_only.py). Red when today's run failed, has not ended,
# or did not start. While dailyUpdate.do is not deployed yet (HTTP 404) the check is skipped with a warning.
# Rerun: Actions > Production morning check > Run workflow (optionally for another day).
on:
  schedule:
    # 16:30 UTC = 08:30 PST (winter), 09:30 PDT (summer). The nightly sets usually end by about 08:00 Pacific.
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day to check, YYYY-MM-DD (Pacific). Empty: today"
        default: ""

concurrency:
  group: prod-morning
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  morning:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # dailyUpdate.do is a page, so Cloudflare would challenge a robot: read it through an SSH tunnel to
      # Tomcat's local port on the production server. Same key and pinned host keys as the Deploy workflow.
      - name: Tunnel to production (read-only use)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Host key check, as the deploys do: production must answer with a key pinned in .github/known_hosts.
          ssh-keyscan -t ed25519,ecdsa,rsa "$SSH_HOST" 2>/dev/null | awk '{print $2" "$3}' | sort -u > /tmp/scanned
          cut -d" " -f2,3 .github/known_hosts | sort -u > /tmp/pinned
          if [ -z "$(comm -12 /tmp/scanned /tmp/pinned)" ]; then
            echo "::error::Production did not answer with a pinned host key (.github/known_hosts). Check stopped."
            exit 1
          fi
          comm -12 /tmp/scanned /tmp/pinned | sed "s|^|$SSH_HOST |" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ConnectTimeout=30 \
            -f -N -L 18081:127.0.0.1:8081 "$SSH_USER@$SSH_HOST"
          rm -f ~/.ssh/id_rsa
          echo "SMOKE_SITE_URL=http://127.0.0.1:18081" >> "$GITHUB_ENV"

      - name: Daily update of today ended without failing
        env:
          SMOKE_TODAY: ${{ inputs.day }}
        run: python3 tests/smoke/prod_smoke.py morning
