name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# One deploy at a time: two merges in a row started two deploys that ran git on the server at the same time,
# and the second failed with exit 128 (2026-10-23). A newer push waits for the running deploy; only the
# newest waiting one runs (it holds every earlier commit). tests/unit/test_deploy_paths.py checks this.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        run: ssh ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} 'DEPLOY_BRANCH=staging bash -s' < .github/scripts/deploy.sh
