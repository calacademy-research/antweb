      - name: Every JSP page changed in this pull request compiles (Jasper JspC, as Tomcat 11 does)
        # 2026-10-23: a page that does not compile (listImageUploads-body.jsp: "Formatter" is ambiguous between
        # java.util.* and org.calacademy.antweb.*) was found only by the staging end-to-end run, 30 minutes later.
        run: |
          git fetch -q --depth=1 origin master
          changed=$(git diff --name-only --diff-filter=AM FETCH_HEAD HEAD -- 'web/*.jsp' | sed 's#^web/##' | tr '\n' ' ')
          if [ -z "$changed" ]; then echo "No JSP page changed"; exit 0; fi
          echo "Changed JSP pages: $changed"
          # A page included with <%@ include file %> is compiled through the pages that include it (tools/ci/jsp_to_compile.py)
          python3 tests/unit/test_jsp_to_compile.py
          files=$(python3 tools/ci/jsp_to_compile.py $changed | tr '\n' ' ')
          echo "Compiled: $files"
          docker run --rm --entrypoint sh -e FILES="$files" antweb/antweb:dev -c '
            set -e
            A=/usr/local/antweb
            CP="/usr/local/tomcat/lib/*:/usr/local/tomcat/bin/*:/usr/share/ant/lib/*:$A/WEB-INF/classes:$A/WEB-INF/lib/*"
            n=0
            for f in $FILES; do
              rm -rf /tmp/jspc; mkdir -p /tmp/jspc
              java -cp "$CP" org.apache.jasper.JspC -uriroot $A -d /tmp/jspc -compile -failFast "$A/$f" > /tmp/jspc.txt 2>&1 || true
              cls=$(find /tmp/jspc -name "*_jsp.class" | wc -l)
              if [ "$cls" -lt 1 ] || grep -qiE "^(SEVERE|ERROR)|JasperException|An error occurred" /tmp/jspc.txt; then
                cat /tmp/jspc.txt
                echo "::error::$f does not compile:%0A$(grep -v "^\s*at " /tmp/jspc.txt | head -30 | sed "s/%/%25/g" | tr "\n" "\001" | sed "s/\x01/%0A/g")"
                exit 1
              fi
              n=$((n+1))
            done
            echo "Changed JSP pages compiled: $n"
          '

      - name: Manager Tools (Museum, Geolocale, Project, Photographers, Admin Alert, map managers, Query and Log Manager)
        # The JSP pages of the Manager Tools compile (Jasper JspC, as Tomcat 11 compiles them).
        # ManagerToolsTest: "None" in Edit Geolocale is no value (a stored "none" bioregion reads as none),
        # query results are text except AntWeb links, linked named queries exist, every page explains
        # itself and prints no request value unescaped, museum page text is keyed by code. ManagerToolsDbTest (MySQL 8.4): museum names with
        # an apostrophe, no duplicate on update, blank code refused, specimen count before a delete, a place
        # with places under it, a deleted place's species list rows. See docs/guides/manager-tools.md.
        run: |
          docker network create mgrcheck
          docker run -d --name mgrmysql --network mgrcheck -e MYSQL_ROOT_PASSWORD=ci-root \
            -e MYSQL_DATABASE=ant -e MYSQL_USER=antweb -e MYSQL_PASSWORD=CHANGE_ME mysql:8.4 --mysql-native-password=ON
          docker run --rm --entrypoint sh antweb/antweb:dev -c '
            set -e
            A=/usr/local/antweb
            CP="/usr/local/tomcat/lib/*:/usr/local/tomcat/bin/*:/usr/share/ant/lib/*:$A/WEB-INF/classes:$A/WEB-INF/lib/*"
            # One JSP at a time, and each must leave its compiled class: JspC can end with status 0
            # without compiling a page (a Java error in editProject-body.jsp passed this step once).
            n=0
            for f in curate/manageMuseums-body.jsp curate/viewMuseum-body.jsp curate/manageMuseums.jsp curate/viewMuseum.jsp \
                curate/geolocale/geolocaleMgr-body.jsp curate/geolocale/editGeolocale-body.jsp curate/geolocale/adm1Mgr-body.jsp \
                curate/projectMgr-body.jsp curate/project/editProject-body.jsp curate/project/editProject.jsp \
                artists-body.jsp artist-body.jsp util/adminAlert.jsp curate/bioregionMapMgr-body.jsp \
                curate/introducedMapMgr-body.jsp curate/curate-body.jsp; do
              rm -rf /tmp/jspc; mkdir -p /tmp/jspc
              java -cp "$CP" org.apache.jasper.JspC -uriroot $A -d /tmp/jspc -compile -failFast "$A/$f" > /tmp/jspc.txt 2>&1 || true
              cls=$(find /tmp/jspc -name "*_jsp.class" | wc -l)
              if [ "$cls" -lt 1 ] || grep -qiE "^(SEVERE|ERROR)|JasperException|An error occurred" /tmp/jspc.txt; then
                cat /tmp/jspc.txt
                echo "::error::$f does not compile:%0A$(grep -v "^\s*at " /tmp/jspc.txt | head -30 | sed "s/%/%25/g" | tr "\n" "\001" | sed "s/\x01/%0A/g")"
                exit 1
              fi
              n=$((n+1))
            done
            echo "Manager Tools JSPs compiled: $n"
          '
          ok=0
          for i in $(seq 1 90); do
            if docker exec mgrmysql mysql -uroot -pci-root -h127.0.0.1 -e "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs mgrmysql 2>&1 | tail -30; echo "::error::MySQL did not start"; exit 1; }
          docker exec mgrmysql mysql -uroot -pci-root -h127.0.0.1 -e "ALTER USER 'antweb'@'%' IDENTIFIED WITH mysql_native_password BY 'CHANGE_ME'"
          docker run --rm --network mgrcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" -v "$PWD/web:/web:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" \
            -e ANTWEB_TEST_DB_URL="jdbc:mysql://mgrmysql:3306/ant?useSSL=false&allowPublicKeyRetrieval=true" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc \
              /t/org/calacademy/antweb/curate/ManagerToolsTest.java /t/org/calacademy/antweb/home/ManagerToolsDbTest.java
            for t in curate.ManagerToolsTest:10 home.ManagerToolsDbTest:4; do
              cls=${t%%:*}; n=${t##*:}
              java -Dantweb.web=/web -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.$cls > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
              grep -v "LogMgr" /tmp/out.txt | tail -3
              grep -q "^OK ($n tests)" /tmp/out.txt || { cat /tmp/out.txt; echo "::error::$cls"; exit 1; }
            done
          '
          docker rm -f mgrmysql

      - name: Java unit tests of the image picker (taxon name properties, Pick buttons not inside another form)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/web:/w:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/tc
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/ImagePickerTest.java
            java -Dantweb.web=/w -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.ImagePickerTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (4 tests)" /tmp/out.txt
          '

      - name: Log rotation covers the data logs with maxsize; message pages write short records (tests/unit/test_log_rotation.py)
        run: python3 tests/unit/test_log_rotation.py

      - name: clearDisk.py skips web/log and links (tests/unit/test_clear_disk.py)
        run: python3 tests/unit/test_clear_disk.py

      - name: deploy.sh no-restart list (tests/unit/test_deploy_paths.py)
        run: python3 tests/unit/test_deploy_paths.py

      - name: The daily dump writes its status line for the mount check (tests/unit/test_dump_status.py)
        run: python3 tests/unit/test_dump_status.py

      - name: Every e2e test file is in the quick set or an area (tests/unit/test_e2e_areas.py)
        run: python3 tests/unit/test_e2e_areas.py

      - name: web/log on a host folder (report links, tomcat writes, log rotation)
        # web/log is a host folder in production (docker-compose.yml: ./logs/web). Starting
        # from an empty one, antweb-fix-perms must make the four upload report links into
        # the bucket and give the folder to tomcat; logrotate (as tomcat) must rotate a big
        # log, leave small files and the report folders alone.
        run: |
          d=$(mktemp -d)
          docker run --rm --entrypoint sh -v "$d:/usr/local/antweb/web/log" antweb/antweb:dev -c '
            set -e
            L=/usr/local/antweb/web/log
            /usr/local/bin/antweb-fix-perms
            for r in specimen worldants detail upload; do
              test "$(readlink $L/$r)" = "/mnt/antweb/web/log/$r" || { echo "missing link $L/$r"; exit 1; }
            done
            /usr/local/bin/antweb-fix-perms   # a second start changes nothing and warns about nothing
            T="setpriv --reuid=tomcat --regid=antweb --init-groups"
            $T sh -c "head -c 11000000 /dev/zero > $L/compute.log; echo flag > $L/siteWarning.txt"
            # As if both files were last rotated long ago: only the one over 10 MB is due.
            printf "logrotate state -- version 2\n\"$L/compute.log\" 2026-1-1-0:0:0\n\"$L/siteWarning.txt\" 2026-1-1-0:0:0\n" > /tmp/s
            chown tomcat /tmp/s
            $T /usr/sbin/logrotate --state /tmp/s /etc/antweb-logrotate.conf
            ls -la $L
            ls $L | grep -q "^compute.log-[0-9]\{8\}-[0-9]\{2\}.gz$" || { echo "compute.log was not rotated and compressed"; exit 1; }
            test -f $L/siteWarning.txt || { echo "small file was rotated"; exit 1; }
            for r in specimen worldants detail upload; do test -L $L/$r; done
            grep -q "logrotate" /etc/cron.d/antwebcrontab
          '

      - name: Data logs (log/, host ./logbak) rotate when over 100 MB, even the first time logrotate sees them
        # 2026-10-22: messages.txt reached 11 GB on staging; logrotate had recorded it on its first run
        # and would only rotate it a week later. maxsize 100M rotates it at the next daily run.
        run: |
          d=$(mktemp -d)
          docker run --rm --entrypoint sh -v "$d:/usr/local/antweb/log" antweb/antweb:dev -c '
            set -e
            D=/usr/local/antweb/log
            /usr/local/bin/antweb-fix-perms
            T="setpriv --reuid=tomcat --regid=antweb --init-groups"
            $T sh -c "head -c 105000000 /dev/zero > $D/messages.txt; head -c 20000000 /dev/zero > $D/longRequest.log"
            # The command of the crontab, with no state file yet (first run).
            $T /usr/sbin/logrotate --state $D/.logrotate.state --log $D/logrotate.log /etc/antweb-logrotate.conf
            ls -la $D
            ls $D | grep -q "^messages.txt-[0-9]\{8\}-[0-9]\{2\}.gz$" || { echo "messages.txt (over 100 MB) was not rotated"; exit 1; }
            test ! -e $D/messages.txt || { echo "messages.txt still there"; exit 1; }
            test -f $D/longRequest.log || { echo "a 20 MB log was rotated on the first run (weekly rule)"; exit 1; }
          '

  java-compile:
    # Compiles every Java source against the jars in WEB-INF/lib and the
    # servlet/JSP APIs of the same Tomcat image production runs, so a change
    # that does not compile is caught on the pull request, not at deploy.
    runs-on: ubuntu-latest
    container: tomcat:11-jdk21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        run: |
          find src -name '*.java' > /tmp/sources.txt
          mkdir -p /tmp/classes
          javac -nowarn -encoding UTF-8 -proc:none \
            -cp "WEB-INF/lib/*:/usr/local/tomcat/lib/*" \
            -d /tmp/classes @/tmp/sources.txt
          echo "Compiled $(wc -l < /tmp/sources.txt) source files" >> "$GITHUB_STEP_SUMMARY"
