        # An entry of tests/e2e/known-failures.toml needs a reason, who decided, and an end date at most 7 days on.
        # Check 8: a running daily update or an unreadable dailyUpdate.do closes the gate (no network use in this test).
        run: python3 tests/unit/test_release_gate.py

      - name: The nightly counts the place list totals after set 4, on their own connection (tests/unit/test_place_totals_connection.py)
        # 2026-11-06: inside set 4 they kept its connection past the long pool's 60 minutes; set 4 failed.
        run: python3 tests/unit/test_place_totals_connection.py

      - name: The place image counts read the imaged specimens; the morning check reads their line (tests/unit/test_place_image_working_set.py)
        # 2026-11-11: the step read every specimen of every place twice (13.6 minutes on production). The working set is
        # made of temporary tables only, with no statement that commits set 4's transaction or locks specimen rows.
        run: python3 tests/unit/test_place_image_working_set.py

      - name: The e2e link reader reads links as a browser does (tests/unit/test_e2e_link_reader.py, finding F27)
        run: python3 tests/unit/test_e2e_link_reader.py

      - name: Actions with the shared dummyForm keep it per request (tests/unit/test_struts_form_scope.py)
        run: python3 tests/unit/test_struts_form_scope.py

      - name: web/log on a host folder (report links, tomcat writes, log rotation)
        # web/log is a host folder in production (docker-compose.yml: ./logs/web). Starting
        # from an empty one, antweb-fix-perms must make the four upload report links into
        # the bucket and give the folder to tomcat; logrotate (as tomcat) must rotate a big
        # log, leave small files and the report folders alone.
        run: |
          d=$(mktemp -d)
          docker run --rm --entrypoint sh -v "$d:/usr/local/antweb/web/log" antweb/antweb:dev -c '
            set -e
            L=/usr/local/antweb/web/log
            /usr/local/bin/antweb-fix-perms
            for r in specimen worldants detail upload; do
              test "$(readlink $L/$r)" = "/mnt/antweb/web/log/$r" || { echo "missing link $L/$r"; exit 1; }
            done
            /usr/local/bin/antweb-fix-perms   # a second start changes nothing and warns about nothing
            T="setpriv --reuid=tomcat --regid=antweb --init-groups"
            $T sh -c "head -c 11000000 /dev/zero > $L/compute.log; echo flag > $L/siteWarning.txt"
            # As if both files were last rotated long ago: only the one over 10 MB is due.
            printf "logrotate state -- version 2\n\"$L/compute.log\" 2026-1-1-0:0:0\n\"$L/siteWarning.txt\" 2026-1-1-0:0:0\n" > /tmp/s
            chown tomcat /tmp/s
            $T /usr/sbin/logrotate --state /tmp/s /etc/antweb-logrotate.conf
            ls -la $L
            ls $L | grep -q "^compute.log-[0-9]\{8\}-[0-9]\{2\}.gz$" || { echo "compute.log was not rotated and compressed"; exit 1; }
            test -f $L/siteWarning.txt || { echo "small file was rotated"; exit 1; }
            for r in specimen worldants detail upload; do test -L $L/$r; done
            grep -q "logrotate" /etc/cron.d/antwebcrontab
          '

      - name: Data logs (log/, host ./logbak) rotate when over 100 MB, even the first time logrotate sees them
        # 2026-10-22: messages.txt reached 11 GB on staging; logrotate had recorded it on its first run
        # and would only rotate it a week later. maxsize 100M rotates it at the next daily run.
        run: |
          d=$(mktemp -d)
          docker run --rm --entrypoint sh -v "$d:/usr/local/antweb/log" antweb/antweb:dev -c '
            set -e
            D=/usr/local/antweb/log
            /usr/local/bin/antweb-fix-perms
            T="setpriv --reuid=tomcat --regid=antweb --init-groups"
            $T sh -c "head -c 105000000 /dev/zero > $D/messages.txt; head -c 20000000 /dev/zero > $D/longRequest.log"
            # The command of the crontab, with no state file yet (first run).
            $T /usr/sbin/logrotate --state $D/.logrotate.state --log $D/logrotate.log /etc/antweb-logrotate.conf
            ls -la $D
            ls $D | grep -q "^messages.txt-[0-9]\{8\}-[0-9]\{2\}.gz$" || { echo "messages.txt (over 100 MB) was not rotated"; exit 1; }
            test ! -e $D/messages.txt || { echo "messages.txt still there"; exit 1; }
            test -f $D/longRequest.log || { echo "a 20 MB log was rotated on the first run (weekly rule)"; exit 1; }
          '

  java-compile:
    # Compiles every Java source against the jars in WEB-INF/lib and the
    # servlet/JSP APIs of the same Tomcat image production runs, so a change
    # that does not compile is caught on the pull request, not at deploy.
    runs-on: ubuntu-latest
    container: tomcat:11-jdk21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        run: |
          find src -name '*.java' > /tmp/sources.txt
          mkdir -p /tmp/classes
          javac -nowarn -encoding UTF-8 -proc:none \
            -cp "WEB-INF/lib/*:/usr/local/tomcat/lib/*" \
            -d /tmp/classes @/tmp/sources.txt
          echo "Compiled $(wc -l < /tmp/sources.txt) source files" >> "$GITHUB_STEP_SUMMARY"
