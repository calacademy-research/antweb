# One-time helper (2026-10-11): fetch updated jars from Maven Central, verify
# SHA-1, build the AntWeb image (which compiles everything with ant), and
# commit the jars to this branch. Delete this file before merging.
name: Update Java libs (one-time)
on:
  push:
    branches: [chore/java-libs]
    paths: [.github/workflows/update-java-libs.yaml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify jars
        run: |
          set -euo pipefail
          M=https://repo1.maven.org/maven2
          cd WEB-INF/lib
          get() { # groupPath artifact version
            f="$2-$3.jar"; curl -fsSL -o "$f" "$M/$1/$2/$3/$f"
            want=$(curl -fsSL "$M/$1/$2/$3/$f.sha1" | cut -c1-40)
            have=$(sha1sum "$f" | cut -c1-40)
            [ "$want" = "$have" ] || { echo "SHA-1 mismatch $f"; exit 1; }
            echo "OK $f $have"
          }
          git rm -q commons-beanutils.jar commons-collections.jar commons-fileupload-1.3.jar \
            commons-io-2.4.jar commons-text-1.4.jar log4j-api-2.17.0.jar log4j-core-2.17.0.jar \
            log4j-jcl-2.17.0.jar log4j-web-2.17.0.jar mysql-connector-java-8.0.23.jar
          get commons-beanutils commons-beanutils 1.9.4
          get commons-collections commons-collections 3.2.2
          get commons-io commons-io 2.18.0
          get org/apache/commons commons-text 1.13.0
          for a in log4j-api log4j-core log4j-jcl log4j-web; do get org/apache/logging/log4j $a 2.24.3; done
          get com/mysql mysql-connector-j 8.4.0
          # Struts 1.1 needs DiskFileUpload: use 1.6.0 if it still has it, else 1.5
          get commons-fileupload commons-fileupload 1.6.0
          if unzip -l commons-fileupload-1.6.0.jar | grep -q 'fileupload/DiskFileUpload.class'; then echo "fileupload 1.6.0 has DiskFileUpload"
          else rm commons-fileupload-1.6.0.jar; get commons-fileupload commons-fileupload 1.5
               unzip -l commons-fileupload-1.5.jar | grep -q 'fileupload/DiskFileUpload.class'; fi
          unzip -l mysql-connector-j-8.4.0.jar | grep -q 'com/mysql/jdbc/Driver.class' && echo "legacy com.mysql.jdbc.Driver present" || echo "WARNING: legacy com.mysql.jdbc.Driver missing"
          ls -1
      - name: Build AntWeb image with Java 11 (compiles all code with ant)
        run: set -o pipefail; docker build -f docker/antweb/Dockerfile -t aw11 . 2>&1 | tail -60
      - name: Check build output
        run: |
          docker run --rm --entrypoint sh aw11 -c 'ls /usr/local/antweb/WEB-INF/lib | sort; find /usr/local/antweb/WEB-INF/classes -name "*.class" | wc -l'
      - name: Trial build with Java 21 (information only)
        continue-on-error: true
        run: |
          sed 's/tomcat:9-jdk11/tomcat:9-jdk21/' docker/antweb/Dockerfile > /tmp/Dockerfile21
          set -o pipefail; docker build -f /tmp/Dockerfile21 -t aw21 . 2>&1 | tail -60
      - name: Commit jars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WEB-INF/lib
          git commit -m "Update Java libraries: beanutils 1.9.4, collections 3.2.2, fileupload, commons-io 2.18.0, commons-text 1.13.0, log4j 2.24.3, mysql-connector-j 8.4.0"
          git push origin HEAD:chore/java-libs
