name: End-to-end tests

# Drives a running AntWeb (staging by default) over HTTP. See tests/e2e/README.md.
# Quick run (under 10 minutes) on pull requests: page loads, permission and CSRF checks, plus the
# tests of the areas the pull request changes (tests/e2e/areas.toml). Full run (every test): daily,
# on demand (Run workflow, full), and for pull requests titled "Do not merge: staging combo..." or
# labelled full-e2e (before a production merge).
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full run (every test). Off: the quick run for this branch's changes against master"
        type: boolean
        default: true
      antweb_url:
        description: "AntWeb to test (write probes are refused on production)"
        default: "https://staging.antweb.org"
      mode:
        description: "test (pytest), survey (report only) or record (re-record the baseline and commit it)"
        default: "test"
      probe_write_actions:
        description: "Also check that data-changing actions refuse anonymous requests"
        default: "1"
  pull_request:
    branches: [master]
    # labeled: adding the full-e2e label starts a full run (other labels start nothing).
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 20 * * *"   # daily 13:17 Pacific (PDT); the 5 AM jobs run until ~8 AM since #62

permissions:
  contents: write
  pull-requests: read

jobs:
  e2e:
    # A label other than full-e2e starts nothing (the job is skipped before it joins the queue below).
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'full-e2e' }}
    runs-on: ubuntu-24.04
    # One run at a time against staging. Overlapping runs (several PRs opened together, or a
    # deploy in the middle of a run) share the site's login limit and restart, and fail at random.
    # A newer queued run replaces an older queued one; a running one is never cancelled.
    # (On the job, not the workflow, so that a skipped label run never replaces a queued one.)
    concurrency:
      group: e2e-${{ inputs.antweb_url || 'staging' }}
      cancel-in-progress: false
    # Full run about 20 minutes, quick run under 10 (tests/e2e/README.md).
    timeout-minutes: 75
    env:
      ANTWEB_URL: ${{ inputs.antweb_url || 'https://staging.antweb.org' }}
      ANTWEB_PROBE_WRITE_ACTIONS: ${{ inputs.probe_write_actions || '1' }}
      MODE: ${{ inputs.mode || 'test' }}
      # Parallel workers for the anonymous read-only tests (logged-in tests run one at a time in one of them).
      E2E_WORKERS: "4"
      ANTWEB_TEST_USER: ${{ secrets.ANTWEB_TEST_USER }}
      ANTWEB_TEST_PASSWORD: ${{ secrets.ANTWEB_TEST_PASSWORD }}
      # Staging-only test accounts (tools/staging/create-test-accounts.py): the test group's
      # uploader, a curator without upload rights, and an administrator. Passed only when the
      # target is staging (empty otherwise); tests that need one skip without it.
      ANTWEB_TEST_UPLOADER_USER: ${{ (inputs.antweb_url || 'https://staging.antweb.org') == 'https://staging.antweb.org' && secrets.ANTWEB_TEST_UPLOADER_USER || '' }}
      ANTWEB_TEST_UPLOADER_PASSWORD: ${{ (inputs.antweb_url || 'https://staging.antweb.org') == 'https://staging.antweb.org' && secrets.ANTWEB_TEST_UPLOADER_PASSWORD || '' }}
      ANTWEB_TEST_NOUPLOAD_USER: ${{ (inputs.antweb_url || 'https://staging.antweb.org') == 'https://staging.antweb.org' && secrets.ANTWEB_TEST_NOUPLOAD_USER || '' }}
      ANTWEB_TEST_NOUPLOAD_PASSWORD: ${{ (inputs.antweb_url || 'https://staging.antweb.org') == 'https://staging.antweb.org' && secrets.ANTWEB_TEST_NOUPLOAD_PASSWORD || '' }}
      ANTWEB_TEST_ADMIN_USER: ${{ (inputs.antweb_url || 'https://staging.antweb.org') == 'https://staging.antweb.org' && secrets.ANTWEB_TEST_ADMIN_USER || '' }}
      ANTWEB_TEST_ADMIN_PASSWORD: ${{ (inputs.antweb_url || 'https://staging.antweb.org') == 'https://staging.antweb.org' && secrets.ANTWEB_TEST_ADMIN_PASSWORD || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Choose the tests (quick or full run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          INPUT_FULL: ${{ inputs.full }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          full=false
          changed=/tmp/changed-files.txt
          : > "$changed"
          case "$EVENT" in
            schedule) full=true ;;
            workflow_dispatch)
              if [ "$INPUT_FULL" = "true" ]; then full=true
              else gh api "repos/$REPO/compare/master...$SHA" --jq '.files[].filename' > "$changed"; fi ;;
            pull_request)
              # Title and labels as they are now (also right for a re-run after adding the label).
              title=$(gh api "repos/$REPO/pulls/$PR" --jq .title)
              labels=$(gh api "repos/$REPO/issues/$PR/labels" --jq '.[].name')
              case "$title" in "Do not merge: staging combo"*) full=true ;; esac
              if printf '%s\n' "$labels" | grep -qx 'full-e2e'; then full=true; fi
              gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > "$changed" ;;
          esac
          echo "E2E_FULL=$full" >> "$GITHUB_ENV"
          if [ "$full" = true ]; then
            printf '## Test selection: full run (%s)\n' "$EVENT" >> "$GITHUB_STEP_SUMMARY"
          else
            python3 tests/e2e/select_tests.py --changed "$changed" --github
          fi
      - run: pip install -r tests/e2e/requirements.txt
      # Headless Chromium for test_browser.py (real-browser checks: JS errors, autocomplete, asset versions).
      - run: python -m playwright install --with-deps chromium
      # Staging only accepts web traffic from Cloudflare, and Cloudflare's bot protection
      # challenges test robots. So the tests reach staging through an SSH tunnel to the
      # server itself (same hostname, same Caddy, no Cloudflare in between).
      - name: Tunnel to staging over SSH
        if: ${{ env.ANTWEB_URL == 'https://staging.antweb.org' }}
        timeout-minutes: 8
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sudo ssh -i ~/.ssh/id_rsa -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=30 -f -N -L 443:127.0.0.1:443 "$SSH_USER@$SSH_HOST"
          echo "127.0.0.1 staging.antweb.org" | sudo tee -a /etc/hosts
          # Staging may use a Cloudflare Origin Certificate: trust Cloudflare's origin CA too.
          curl -sSf --max-time 30 -o /tmp/cf-origin-ca.pem https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem
          cat "$(python -m certifi)" /tmp/cf-origin-ca.pem > /tmp/ca-bundle.pem
          echo "REQUESTS_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"
          # Chromium (test_browser.py): same host mapping as /etc/hosts, and accept the origin
          # certificate (Chromium ignores REQUESTS_CA_BUNDLE; requests-based tests verify it).
          echo "ANTWEB_BROWSER_HOST_RULES=MAP staging.antweb.org 127.0.0.1" >> "$GITHUB_ENV"
          echo "ANTWEB_BROWSER_IGNORE_HTTPS_ERRORS=1" >> "$GITHUB_ENV"
          curl -sS --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors --cacert /tmp/ca-bundle.pem -o /dev/null -w 'staging via tunnel: HTTP %{http_code}\n' https://staging.antweb.org/
      - name: Staging-only test accounts are used on staging only
        run: |
          if [ "$ANTWEB_URL" != "https://staging.antweb.org" ]; then
            for v in ANTWEB_TEST_UPLOADER_USER ANTWEB_TEST_NOUPLOAD_USER ANTWEB_TEST_ADMIN_USER; do
              [ -z "${!v}" ] || { echo "::error::$v is set for $ANTWEB_URL"; exit 1; }
            done
          fi
          for v in ANTWEB_TEST_UPLOADER_USER ANTWEB_TEST_NOUPLOAD_USER ANTWEB_TEST_ADMIN_USER; do
            [ -n "${!v}" ] && echo "$v: set" || echo "$v: not set (its tests skip)"
          done
      # The survey (about 6 minutes) is a report; test_actions.py checks the same pages against the
      # baseline. It runs daily, on demand and for survey/record, not on pull requests.
      - name: Survey (report in the job summary)
        if: ${{ github.event_name != 'pull_request' || env.MODE != 'test' || hashFiles('tests/e2e/expectations.json') == '' || hashFiles('tests/e2e/snapshots.json') == '' }}
        run: python tests/e2e/survey.py
      - name: Record baseline (first run, or mode=record)
        if: ${{ env.MODE == 'record' || hashFiles('tests/e2e/expectations.json') == '' || hashFiles('tests/e2e/snapshots.json') == '' }}
        run: |
          [ -f tests/e2e/expectations.json ] && [ "$MODE" != record ] || cp tests/e2e/out/expectations.json tests/e2e/expectations.json
          [ -f tests/e2e/snapshots.json ] && [ "$MODE" != record ] || cp tests/e2e/out/snapshots.json tests/e2e/snapshots.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/expectations.json tests/e2e/snapshots.json
          git commit -m "e2e: record baseline from $ANTWEB_URL" && git push
      # Anonymous read-only tests run side by side in E2E_WORKERS workers; every other test runs one
      # at a time in one worker (xdist group "serial", tests/e2e/conftest.py). The full run is the
      # whole suite; the quick run is the files chosen above.
      - name: Tests
        if: ${{ env.MODE == 'test' && hashFiles('tests/e2e/expectations.json') != '' }}
        run: |
          set -uo pipefail
          args=(-q -rfEs -p no:cacheprovider --durations=30 -n "$E2E_WORKERS" --dist loadgroup)
          if [ "$E2E_FULL" = true ]; then
            E2E_RUN=full pytest tests/e2e "${args[@]}"
          else
            read -r -a targets <<< "$E2E_TARGETS"
            echo "Quick run, areas: ${E2E_AREAS:-none}; ${#targets[@]} test files"
            E2E_RUN=quick pytest "${targets[@]}" "${args[@]}"
          fi
