      - name: Place fix against MySQL 8.4, apply and rollback never overwrite newer values (tests/unit/test_place_fix_db.py)
        # Review of PR #341 (2026-11-10): the tool runs against a database of its own, through the docker exec it uses
        # on the servers: a specimen changed between the backup and the update is left as it is and counted; a rollback
        # leaves alone and lists what has other values by now, also from a backup table as versions 1 to 3 wrote it;
        # a latin1 table (the bytes compared as UTF-8); values as long as the columns allow; a failed apply leaves no table.
        run: |
          docker run -d --name pfmysql -e MYSQL_ROOT_PASSWORD=ci-root mysql:8.4
          ok=0
          for i in $(seq 1 90); do
            if docker exec pfmysql mysql -uroot -pci-root -h127.0.0.1 -e "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs pfmysql 2>&1 | tail -30; echo "::error::MySQL did not start"; exit 1; }
          PLACE_FIX_TEST_CONTAINER=pfmysql PLACE_FIX_TEST_PASSWORD=ci-root python3 tests/unit/test_place_fix_db.py | tee /tmp/place_fix_db.txt
          grep -q "^6 tests passed (MySQL 8.4" /tmp/place_fix_db.txt
          # The image view of the GBIF archive (2026-11-11): the upgrade file and its rollback run against the same
          # server; ten columns in their order, medium static addresses, nothing else changed, one row per image.
          GBIF_VIEW_TEST_CONTAINER=pfmysql GBIF_VIEW_TEST_PASSWORD=ci-root python3 tests/unit/test_gbif_image_view.py | tee /tmp/gbif_view.txt
          grep -q "^5 tests passed (texts)" /tmp/gbif_view.txt
          grep -q "^2 database tests passed (MySQL 8.4" /tmp/gbif_view.txt
          docker rm -f pfmysql

