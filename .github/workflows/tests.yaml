          # DownloadGuardsDbTest: a place download holds only the specimens collected there (5,000 cap), the paged
          # search list (COUNT, LIMIT/OFFSET, sort before paging, images/types only), ant specimens only on place pages.
          docker run --rm --network tzcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
