name: End-to-end tests

# Drives a running AntWeb (staging by default) over HTTP. See tests/e2e/README.md.
on:
  workflow_dispatch:
    inputs:
      antweb_url:
        description: "AntWeb to test (write probes are refused on production)"
        default: "https://staging.antweb.org"
      mode:
        description: "test (pytest), survey (report only) or record (re-record the baseline and commit it)"
        default: "test"
      probe_write_actions:
        description: "Also check that data-changing actions refuse anonymous requests"
        default: "1"
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 20 * * *"   # daily 13:17 Pacific (PDT); the 5 AM jobs run until ~8 AM since #62

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANTWEB_URL: ${{ inputs.antweb_url || 'https://staging.antweb.org' }}
      ANTWEB_PROBE_WRITE_ACTIONS: ${{ inputs.probe_write_actions || '1' }}
      MODE: ${{ inputs.mode || 'test' }}
      ANTWEB_TEST_USER: ${{ secrets.ANTWEB_TEST_USER }}
      ANTWEB_TEST_PASSWORD: ${{ secrets.ANTWEB_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt
      # Staging only accepts web traffic from Cloudflare, and Cloudflare's bot protection
      # challenges test robots. So the tests reach staging through an SSH tunnel to the
      # server itself (same hostname, same Caddy, no Cloudflare in between).
      - name: Tunnel to staging over SSH
        if: ${{ env.ANTWEB_URL == 'https://staging.antweb.org' }}
        timeout-minutes: 8
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sudo ssh -i ~/.ssh/id_rsa -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=30 -f -N -L 443:127.0.0.1:443 "$SSH_USER@$SSH_HOST"
          echo "127.0.0.1 staging.antweb.org" | sudo tee -a /etc/hosts
          # Staging may use a Cloudflare Origin Certificate: trust Cloudflare's origin CA too.
          curl -sSf --max-time 30 -o /tmp/cf-origin-ca.pem https://developers.cloudflare.com/ssl/static/origin_ca_rsa_root.pem
          cat "$(python -m certifi)" /tmp/cf-origin-ca.pem > /tmp/ca-bundle.pem
          echo "REQUESTS_CA_BUNDLE=/tmp/ca-bundle.pem" >> "$GITHUB_ENV"
          curl -sS --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors --cacert /tmp/ca-bundle.pem -o /dev/null -w 'staging via tunnel: HTTP %{http_code}\n' https://staging.antweb.org/
      - name: Survey (report in the job summary)
        run: python tests/e2e/survey.py
      - name: Record baseline (first run, or mode=record)
        if: ${{ env.MODE == 'record' || hashFiles('tests/e2e/expectations.json') == '' || hashFiles('tests/e2e/snapshots.json') == '' }}
        run: |
          [ -f tests/e2e/expectations.json ] && [ "$MODE" != record ] || cp tests/e2e/out/expectations.json tests/e2e/expectations.json
          [ -f tests/e2e/snapshots.json ] && [ "$MODE" != record ] || cp tests/e2e/out/snapshots.json tests/e2e/snapshots.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/expectations.json tests/e2e/snapshots.json
          git commit -m "e2e: record baseline from $ANTWEB_URL" && git push
      - name: Tests
        if: ${{ env.MODE == 'test' && hashFiles('tests/e2e/expectations.json') != '' }}
        run: pytest tests/e2e -q -rfE -p no:cacheprovider
