name: Production page speed

# Read-only timing of the pages that do the most work on production (tests/smoke/prod_smoke.py speed; one GET per
# page, a second when the first was over the limit or failed, no sign-in; tests/unit/test_smoke_read_only.py). Red when a
# page is over its limit (about twice its usual time), so a slowdown is seen within hours instead of from users
# (2026-11-17: species images pages had taken 5 to 10 s for about a week before Jack Longino said so). The summary of
# each run lists every page's time: the runs are the log (Actions > Production page speed).
# Not during the daily update (05:00 to about 08:30 Pacific), whose load would make every page slow.
on:
  schedule:
    # 02:17, 06:17, 10:17, 18:17, 22:17 UTC = 18:17, 22:17, 02:17, 10:17, 14:17 PST (an hour later in summer)
    - cron: "17 2,6,10,18,22 * * *"
  workflow_dispatch:

concurrency:
  group: prod-speed
  # A run by hand waits for a scheduled one instead of cancelling it (a cancelled run leaves no times).
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The pages are read through an SSH tunnel to Tomcat's local port on the production server (Cloudflare would
      # challenge a robot, and the time is AntWeb's own, without Cloudflare). Same key and pinned host keys as Deploy.
      - name: Tunnel to production (read-only use)
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Host key check, as the deploys do: production must answer with a key pinned in .github/known_hosts.
          ssh-keyscan -t ed25519,ecdsa,rsa "$SSH_HOST" 2>/dev/null | awk '{print $2" "$3}' | sort -u > /tmp/scanned
          cut -d" " -f2,3 .github/known_hosts | sort -u > /tmp/pinned
          if [ -z "$(comm -12 /tmp/scanned /tmp/pinned)" ]; then
            echo "::error::Production did not answer with a pinned host key (.github/known_hosts). Check stopped."
            exit 1
          fi
          comm -12 /tmp/scanned /tmp/pinned | sed "s|^|$SSH_HOST |" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ConnectTimeout=30 \
            -f -N -L 18081:127.0.0.1:8081 "$SSH_USER@$SSH_HOST"
          rm -f ~/.ssh/id_rsa
          echo "SMOKE_SITE_URL=http://127.0.0.1:18081" >> "$GITHUB_ENV"

      - name: Pages answer within their limits
        run: python3 tests/smoke/prod_smoke.py speed
