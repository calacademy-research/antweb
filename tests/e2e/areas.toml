# How the end-to-end tests are split. Read by conftest.py, select_tests.py and
# tests/unit/test_e2e_areas.py; explained in README.md ("Quick and full runs").
#
# Entries name a whole test file ("test_x.py") or one test function of it ("test_x.py::test_y",
# every parameter set included). Every test file must be in [quick] or in at least one area
# (tests/unit/test_e2e_areas.py checks it in the pull request checks). A file listed here before
# the pull request that adds it is merged is fine (it is ignored until it exists).
#
# The FULL run is always the whole suite (pytest tests/e2e), whatever this file says.

[quick]
# In every quick run: page loads of every public page type, the API, real-browser checks of the
# key pages, permission checks (anonymous visitors and curators refused admin pages, private files
# not public, data-changing actions ask for a login), CSRF refusals, the curator login.
tests = [
  "test_actions.py",            # every Struts action and recorded page against the baseline
  "test_page_content.py",       # key pages show the same content
  "test_api.py",
  "test_header_version.py",
  "test_browser.py",            # JavaScript errors, header search boxes, asset versions, phone width
  "test_privacy.py",            # private files and folder listings not public
  "test_jsp_allow_list.py",     # direct JSP calls refused
  "test_login_needed.py",
  "test_request_handling.py",   # quote characters, error pages, form token (CSRF) refusals
  "test_curator.py",            # curator login, admin pages refused, CSRF, remember-me
  "test_curate_cleanup.py",     # admin tools refused to anonymous visitors and curators
  "test_parallel_safety.py",    # answers that must not change while another request or an upload runs
]

[full_when]
# A pull request that changes one of these gets the full run instead of the quick one
# (they change every page: libraries, the Tomcat image, the database server).
paths = [
  "WEB-INF/lib/**",
  "WEB-INF/web.xml",
  "docker/antweb/Dockerfile",
  "docker/mysql/**",
  "docker-compose.yml",
]

[parallel]
# Anonymous, read-only tests that never log in: run side by side (pytest-xdist, -n 4). Every other
# test (logged in, uploads, anything that changes state) runs one at a time in one worker, so the
# login limit (10 a minute) and the test records are never shared. A test listed here that logs in
# fails with "logs in but is listed in [parallel]" (antweb.post_login): remove it from the list.
tests = [
  # whole files
  "test_actions.py",
  "test_api.py",
  "test_browser.py",
  "test_check57_removals.py",
