# One-time helper (2026-10-14): jars and stock Tomcat config for the Tomcat 11
# (Jakarta EE) upgrade. Fetch from Maven Central, verify SHA-1, commit. Delete before merging.
name: Update Java libs (one-time)
on:
  push:
    branches: [chore/tomcat11]
    paths: [.github/workflows/update-java-libs.yaml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify jars
        run: |
          set -euo pipefail
          M=https://repo1.maven.org/maven2; cd WEB-INF/lib
          get() {  # groupPath artifact version
            f=$2-$3.jar
            curl -fsSL -o $f $M/$1/$2/$3/$f
            want=$(curl -fsSL $M/$1/$2/$3/$f.sha1 | cut -c1-40)
            [ "$want" = "$(sha1sum $f | cut -c1-40)" ] && echo "OK $f $want"
          }
          W=io/github/weblegacy
          for a in struts-core struts-taglib struts-tiles struts-extras; do get $W $a 1.5.0-RC2; done
          get $W commons-chain-web-jakarta 1.3.0
          get $W commons-chain-web-jakarta-servlet 1.3.0
          get org/apache/commons commons-fileupload2-core 2.0.0-M1
          get org/apache/commons commons-fileupload2-jakarta 2.0.0-M1
          get org/apache/logging/log4j log4j-jakarta-web 2.24.3
          git rm -q struts-core-1.4.5.jar struts-taglib-1.4.5.jar struts-tiles-1.4.5.jar struts-extras-1.4.5.jar \
            commons-chain-web-javax-1.3.0.jar commons-chain-web-javax-servlet-1.3.0.jar \
            commons-fileupload-1.6.0.jar log4j-web-2.24.3.jar
      - name: Stock Tomcat 9 and 11 config, for comparison
        run: |
          set -euo pipefail
          for v in 9 11; do
            mkdir -p tmp-tomcat-conf/$v
            docker run --rm tomcat:$v-jdk21 tar -C /usr/local/tomcat/conf -c . | tar -x -C tmp-tomcat-conf/$v
            docker run --rm tomcat:$v-jdk21 sh -c 'cat /usr/local/tomcat/RELEASE-NOTES | grep -m1 "Apache Tomcat Version"' > tmp-tomcat-conf/$v/VERSION
          done
          cat tmp-tomcat-conf/*/VERSION
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WEB-INF/lib tmp-tomcat-conf
          git commit -m "Jakarta jars (Struts1 Reloaded 1.5.0-RC2 and friends); stock Tomcat 9/11 conf"
          git push origin HEAD:chore/tomcat11
