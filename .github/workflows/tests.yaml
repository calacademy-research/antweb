          # not species (totals, genus rows, pies, endemism) but their specimens count; a list's genus, subfamily and family
          # rows hold the images of every row under them by the taxon tree (B40).
          # NumberDecisionsDbTest (2026-10-22, Brian Fisher's answers Q7, Q8, Q9, Q12, Port of Entry): statsPage and home
          # count ants only; upload group Species are full names and the groups.do Totals row is distinct over all groups;
          # orphaned images counted as images and codes; unimaged = no photo of the ant anywhere; Port of Entry has no
          # specimen or image numbers and the count check skips it.
          # DownloadGuardsDbTest: a place download holds only the specimens collected there (5,000 cap), the paged
          # search list (COUNT, LIMIT/OFFSET, sort before paging, images/types only), ant specimens only on place pages.
          # PlaceTaxonNotesDbTest (2026-10-29): country and adm1 lists get the genus rows of specimens identified to genus
          # (not the names); the genus page's indet line counts the place's specimens; the not-recorded notice's queries;
          # 2026-10-30: the specimens collected in a place under names not on its species list, by genus (one query).
          # GeneraRuleDbTest (2026-10-30): Genera count valid genera and morphogenera only (placeholders such as
          # "(myrmicinae)" and unrecognized genus names are not genera), in the nightly totals, the subfamily rows' Genera,
