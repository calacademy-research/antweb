# AntWeb log rotation, installed as /etc/antweb-logrotate.conf (root-owned).
# Run daily by docker/antweb/crontab.txt as the user tomcat, which owns these
# folders (both are host folders: ./logs/web and ./logbak), so root never opens
# a file Tomcat could have replaced.
#
# Only the top-level *.log and *.txt files are rotated, and only once they pass
# 10 MB, at most once a week: small files the site keeps as state (flags,
# reports it rewrites) are never touched. A file over 100 MB (maxsize) is
# rotated at the next daily run, whatever the week.
#
# Why maxsize (2026-10-22): logrotate records a file it has not seen before with
# the date of that run and rotates it only a week later. Rotation started on
# 2026-10-19, so the first weekly rotation would have been 2026-10-25, while
# messages.txt was already 11 GB on staging and 1.8 GB on production
# (logrotate.log said "log does not need rotating (log has already been
# rotated)"). With maxsize a runaway log is rotated and compressed within a day. The upload report folders
# (web/log/specimen, worldants, detail, upload) are links into the bucket and
# are records: a top-level glob never enters them, so they are kept forever.
# AntWeb opens, appends and closes its logs on every write, so moving the file
# is safe; the next write starts a new one (nocreate).
#
# Old copies: compute.log-20261025.gz, compressed at once (no delaycompress, so a
# multi-GB copy is never kept plain), 26 kept per log; older ones are deleted.

/usr/local/antweb/web/log/*.log
/usr/local/antweb/web/log/*.txt
/usr/local/antweb/log/*.log
/usr/local/antweb/log/*.txt
{
    weekly
    minsize 10M
    maxsize 100M
    rotate 26
    dateext
    dateformat -%Y%m%d
    compress
    missingok
    notifempty
    nocreate
    nomail
}
