      - name: Database tests against MySQL 8.4 (Pacific dates in the connection pools; curator species-list rows kept; name update; count check; place image counts; region counts; place renames keep page text; every place's numbers; specimen name history; download guards; genera rule)
        # DbTimeZoneTest: dates written by MySQL and by Java read back as the same moment and are
        # stored as Pacific wall-clock time, for conPool, mediumConPool and longConPool.
        run: |
          ! grep -rnE "jdbc:mysql[^\"]*serverTimezone" WEB-INF src --include=*.xml --include=*.java || { echo "::error::serverTimezone in a JDBC URL (use connectionTimeZone=LOCAL)"; exit 1; }
          cmp WEB-INF/struts-configDbAnt.xml WEB-INF/struts-configDb.xml
          docker network create tzcheck
          docker run -d --name mysql --network tzcheck -e TZ=America/Los_Angeles -e MYSQL_ROOT_PASSWORD=ci-root \
            -e MYSQL_DATABASE=ant -e MYSQL_USER=antweb -e MYSQL_PASSWORD=CHANGE_ME \
            -v "$PWD/docker/mysql/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro" mysql:8.4 --mysql-native-password=ON
          ok=0
          for i in $(seq 1 90); do
            if docker exec mysql mysql -uroot -pci-root -h127.0.0.1 -e "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs mysql 2>&1 | tail -30; echo "::error::MySQL did not start"; exit 1; }
          # As in production: the antweb login uses mysql_native_password (the driver does not use SSL).
          docker exec mysql mysql -uroot -pci-root -h127.0.0.1 -e "ALTER USER 'antweb'@'%' IDENTIFIED WITH mysql_native_password BY 'CHANGE_ME'"
          # IslandCountryDbTest works in a schema of its own, which it makes and drops (never the tables of ant).
          docker exec mysql mysql -uroot -pci-root -h127.0.0.1 -e "GRANT ALL ON ant_islandtest.* TO 'antweb'@'%'"
          docker run --rm --network tzcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/WEB-INF:/w:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/DbTimeZoneTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.DbTimeZoneTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (4 tests)" /tmp/out.txt
          '
          # CuratorTaxonSetTest: curator rows of region and project species lists survive the
          # nightly cleanup (parked in taxon_set_parked, restored when the name exists again).
          docker run --rm --network tzcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/home/CuratorTaxonSetTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.home.CuratorTaxonSetTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            grep -v "LogMgr" /tmp/out.txt | tail -5
            grep -q "^OK (6 tests)" /tmp/out.txt
          '
          # SpecimenNameUpdateDbTest: the nightly name update (report, apply, cap, parked list entries, names kept on a
          # valid name), the upload report's reason read from the same tables, and the same shared-name line in the
          # upload report and on the page; the second pass (2026-11-03): synonym-genus morphospecies and indets, names
          # without subfamily, taxon rows made in apply only, the no_genus and no_combo lists; the third pass (old genus
          # concepts by bioregion); the proposal queries and an approved genus_concept_rule row driving the move.
          # CountCheckTest: list counts against a recount from specimens (real and pending differences).
          # PlaceImageCountDbTest: Images, images per view and Imaged specimens of places (labels apart),
          # per-taxon image counts of a place, and the count check of those numbers; red-flagged specimens'
          # images not counted (2026-11-09). Since 2026-11-11 the daily update counts from a working set of the imaged
          # specimens (session tables): the new statements are the old ones with another table name, both give the
          # same rows on a fixture with every rule, the tables written are identical, a run without the working set
          # uses the old statements, nothing is committed inside the caller's transaction, and the comparison job
          # (utilData.do?action=placeImageCountCompare) finds a difference and writes nothing. On MySQL here, where a
          # temporary table cannot be read twice in one statement.
          # RegionCountDbTest: region and subregion numbers count the specimens of their countries only.
          # BackgroundJobDbTest: the background_job table (status pages of uploads and admin jobs; interrupted at start-up).
          # DailyUpdateDbTest (2026-11-07): the daily_update_step table of the Daily update page (start, end, read back in
          # step order; usual time = median of the ok rows of the last completed runs; last runs; prune).
          # UploadRecordDbTest: a specimen upload's row in the upload table is written for any group name (quote, long,
          # non-BMP), in the upload's transaction, and a failure is thrown, not only logged (production 2026-10-21).
          # PageTextRenameDbTest: renaming a place (editGeolocale.do) moves its page text and history (object_edit,
          # object_hist) with their dates; a new name that has page text already is refused and nothing changes.
          # The rename also carries the new name to child places, the region/subregion columns below, synonyms and a
          # country's curator assignments (login_country), in the same transaction; an ambiguous old name carries nothing.
          # SpecimenNameHistoryDbTest: the specimen page's Name History query (applied rows of one specimen, newest first,
          # never report-only rows; index by_code; no history when the table is missing).
          # CountInvariantsTest: the count check's invariants over every place (docs/numbers.md), each wrong number found;
          # a red-flagged imaged specimen: pending until the nightly run, then real, agreeing once recounted (2026-11-09).
          # NumberChecksTest: the count check's other numbers (statsPage tables, admin pages, API /taxa, endemic flags, B25, the
          # adm1 Specimens recount by country and name: B26 fixed 2026-11-09).
          # PlaceTotalsDbTest: the numbers the nightly run writes (place totals, pies, endemic, museums, taxon images,
          # home page, Global after the name update, statsPage) as the invariants expect them.
          # NightlyCountOrderDbTest (2026-10-22): an unavailable name does not raise its genus row; a museum list renamed
          # before its count (a synonym's specimens under the valid name); curator page-text edits; group numbers of today.
          # TaxonTreeCountDbTest (2026-10-22): every counted ant name identified to genus has its genus row as parent where
          # that row exists (nightly repair, B36; no genus rows made, the rest reported); names not identified to genus are
          # not species (totals, genus rows, pies, endemism) but their specimens count; a list's genus, subfamily and family
          # rows hold the images of every row under them by the taxon tree (B40).
          # NumberDecisionsDbTest (2026-10-22, Brian Fisher's answers Q7, Q8, Q9, Q12, Port of Entry): statsPage and home
          # count ants only; upload group Species are full names and the groups.do Totals row is distinct over all groups;
          # orphaned images counted as images and codes; unimaged = no photo of the ant anywhere; Port of Entry has no
          # specimen or image numbers and the count check skips it; photos of red-flagged specimens are counted in no
          # image or imaged number of the home page and statsPage (2026-11-09).
          # IslandCountryDbTest (2026-11-11): a specimen stored with country = island_country = the island is the
          # island's, once, and never its political parent's, in every place number, list and download; endemic.
          # In its own schema ant_islandtest (granted above), dropped when it ends.
          # DownloadGuardsDbTest: a place download holds only the specimens collected there (5,000 cap), the paged
          # search list (COUNT, LIMIT/OFFSET, sort before paging, images/types only), ant specimens only on place pages.
          # PlaceTaxonNotesDbTest (2026-10-29): country and adm1 lists get the genus rows of specimens identified to genus
          # (not the names); the genus page's indet line counts the place's specimens; the not-recorded notice's queries;
          # 2026-10-30: the specimens collected in a place under names not on its species list, by genus; 2026-11-02:
          # the views (Valid, Curated, All specimen names): curated morphospecies, the names of specimens collected there,
          # disputes, red flags, the genus rows' Species, species imaged and which rows each view shows, the same from the
          # names stored nightly; 2026-11-03 (B77): a subfamily row's Genera = the genus rows of its browse page in the
          # same view. PlaceGenusCurationDbTest (2026-11-02): the nightly Not curated count per place and genus
          # (valid names and curated morphospecies left out; uncurated morphospecies, indet and unrecognized names counted;
          # red flags never; country and island_country once; adm1s, museums, bioregions), the page's read (no table: no
          # error), the view Not curated's names.
          # GeneraRuleDbTest (2026-10-30): Genera count valid genera and morphogenera only (placeholders such as
          # "(myrmicinae)" and unrecognized genus names are not genera), in the nightly totals, the subfamily rows' Genera,
          # upload groups and the count check; Subfamilies count valid subfamilies only (not "(formicidae)" or misspelled
          # names, curated projects too: B67 superseded); the Worldants change alert compares each import with the previous one.
          # ParentRowsDbTest (2026-11-03, B76): the nightly count adds the missing genus and subfamily rows of every kind
          # of list (not placeholders, other statuses, names without a taxon row or parents a curator removed), so the rows
