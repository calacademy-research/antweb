name: Tests

on:
  pull_request:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Version number matches (.version and the site header)
        run: |
          v=$(tr -d '[:space:]' < .version)
          grep -q "antwebRelease = \"$v\"" web/documentation/releaseNum.jsp \
            || { echo "::error::.version is $v but web/documentation/releaseNum.jsp differs"; exit 1; }

      - name: Test Caddy Build
        run: |
          cd docker/caddy
          docker build -t antweb/caddy:dev .

      - name: Check Caddyfiles (prod and staging)
        run: |
          for f in Caddyfile Caddyfile.staging; do
            docker run --rm -v "$PWD/docker/caddy:/etc/caddy:ro" antweb/caddy:dev \
              caddy adapt --config /etc/caddy/$f --adapter caddyfile > /dev/null \
              || { echo "::error::$f is not a valid Caddyfile"; exit 1; }
            echo "$f OK"
          done

      - name: JSP allow-list is the same in Caddyfile and Caddyfile.common
        run: python3 tests/e2e/caddy_lists.py

      - name: Function catalog has a row for every action
        # Regenerates the catalog in memory and fails when a Struts action or sub-action has no
        # row in docs/catalog/actions.csv. Fix: python3 tools/catalog/build_catalog.py, fill in
        # purpose and status of the new rows, commit docs/catalog/ (see docs/README.md).
        run: python3 tools/catalog/build_catalog.py --check

      - name: Every number on the site names its test (docs/numbers.md)
        # Each kind of number AntWeb shows has a row: status yes, partly or not yet; the tests it names exist;
        # every count check (CountInvariants.IDS) is named. Fix: edit docs/numbers.md (see its section 1).
        run: python3 tools/numbers/check_numbers_doc.py

      - name: Every workflow step is valid shell, also inside sh -c '...' (tests/unit/test_workflow_shell.py)
        # 2026-10-24: an apostrophe in a comment ended a quoted sh -c script early; the step failed only on GitHub.
        run: python3 tests/unit/test_workflow_shell.py

      - name: Each Java test step expects the number of tests its class has (tests/unit/test_ci_test_counts.py)
        run: python3 tests/unit/test_ci_test_counts.py

      - name: Every deploy compiles every Java source (tests/unit/test_build_full_compile.py)
        run: python3 tests/unit/test_build_full_compile.py

      - name: Reading the login never creates a session (tests/unit/test_access_login_no_new_session.py)
        run: python3 tests/unit/test_access_login_no_new_session.py

      - name: List notes in plain words (tests/unit/test_list_admin_wording.py)
        run: python3 tests/unit/test_list_admin_wording.py

      - name: Numbers of the 2026-10-28 rules pending until the nightly run (tests/unit/test_rules_pending.py)
        run: python3 tests/unit/test_rules_pending.py

      - name: Notes under every list, one block in the 2026-10-28 wording (tests/unit/test_list_notes.py)
        run: python3 tests/unit/test_list_notes.py

      - name: Admin Alert page buttons and dates (tests/unit/test_admin_alert_page.py)
        run: python3 tests/unit/test_admin_alert_page.py

      - name: Set 4 counts the AntWeb-wide list's Images (tests/unit/test_allantweb_image_crawl.py)
        run: python3 tests/unit/test_allantweb_image_crawl.py

      - name: Deploys check the pinned server host keys (tests/unit/test_deploy_known_hosts.py)
        run: python3 tests/unit/test_deploy_known_hosts.py

      - name: The mount check writes into a folder that exists on the servers (tests/unit/test_mountcheck_dir.py)
        run: python3 tests/unit/test_mountcheck_dir.py

      - name: The nightly AntCat download runs before set 1 takes its connection (tests/unit/test_set1_prefetch.py)
        run: python3 tests/unit/test_set1_prefetch.py

      - name: Every Java class and JSP has a header comment, new files included (tools/ci/check_headers.py)
        # Road map step 4. tools/ci/headers-missing.txt lists the files still without one; it only shrinks.
        # Fails when a file not listed there has no header, or a listed file now has one (remove its line).
        # The rules: tests/unit/test_check_headers.py.
        run: |
          python3 tests/unit/test_check_headers.py
          python3 tools/ci/check_headers.py

      - name: Data model doc has a section for every table (docs/data-model.md)
        # Replays db/upgrade/**/*.sql and the CREATE TABLE statements in src/; fails when a table or view
        # has no "### `name`" section in docs/data-model.md, or a section names a table no SQL knows, or
        # (2026-10-22) the repository's SQL and the committed production snapshot doc/schema/live-schema-*.tsv
        # differ in a way the allow-list in list_tables.py does not explain (dated backups, old unused tables).
        # Fix: add the section, or the db/upgrade file (see the top of docs/data-model.md). The parser's own
        # cases: tests/unit/test_datamodel_list_tables.py.
        run: |
          python3 tests/unit/test_datamodel_list_tables.py
          python3 tools/datamodel/list_tables.py --check

      - name: Test API Build
        run: |
          docker build -t antweb/api:dev -f docker/api/Dockerfile .

      - name: Compose files are valid (prod and staging)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.stage.yml config -q

      - name: API limits and streamed ndjson (tests/unit/test_api_limits.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_limits.py

      - name: API refuses unknown parameters, code and rank aliases, documented examples (tests/unit/test_api_params.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" -v "$PWD/web/documentation/api:/docs:ro" \
            antweb/api:dev /t/test_api_params.py

      - name: API counts (tests/unit/test_api_counts.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_counts.py

      - name: API images of the ant and label images (antImageCount, labelImageCount; tests/unit/test_api_image_split.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_image_split.py

      - name: API findings F6, F7, F8, F20, F22, F23 (/images url, valid filters, fixed order, debug lines, geoSpecimens radius, geoSpeciesStats not found) (tests/unit/test_api_findings.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_findings.py

      - name: API finding F24, country is the whole name and distinct species are full names (tests/unit/test_api_country.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" -v "$PWD/web/documentation/api:/docs:ro" \
            antweb/api:dev /t/test_api_country.py

      - name: API inputs (filters that failed, 400 for bad bbox and since, unset values, login file) (tests/unit/test_api_inputs.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_inputs.py

      - name: API licence CC BY 4.0 on every reply (Link header, top-level license; tests/unit/test_api_license.py)
        run: |
          docker run --rm --entrypoint python -e LICENSE_JAVA=/repo/License.java -v "$PWD/tests/unit:/t:ro" \
            -v "$PWD/src/org/calacademy/antweb/util/License.java:/repo/License.java:ro" antweb/api:dev /t/test_api_license.py

      - name: API audit fixes of 2026-10-29 (one geolocale's list for /specimens, adm1s in their own country) (tests/unit/test_api_audit_tj.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_audit_tj.py

      - name: API decisions of 2026-10-27 (subcastes within caste, inclusive bounds, 503 without up, login required) (tests/unit/test_api_decisions.py)
        run: |
          docker run --rm --entrypoint python -e REPO_DIR=/repo -v "$PWD/tests/unit:/t:ro" \
            -v "$PWD/docker-compose.yml:/repo/docker-compose.yml:ro" -v "$PWD/docker-compose.dev.yml:/repo/docker-compose.dev.yml:ro" \
            antweb/api:dev /t/test_api_decisions.py

      - name: API refuses to start without its read-only login (API_REQUIRE_READONLY_LOGIN=true, as on the servers)
        run: |
          d=$(mktemp -d)
          set +e
          timeout 120 docker run --rm -e API_REQUIRE_READONLY_LOGIN=true -v "$d:/antweb-etc:ro" antweb/api:dev > "$d.log" 2>&1
          code=$?
          set -e
          tail -20 "$d.log"
          [ "$code" != 0 ] && [ "$code" != 124 ] || { echo "::error::the API did not stop (exit $code)"; exit 1; }
          grep -q "ERROR: no read-only login" "$d.log" || { echo "::error::no ERROR line about the login file"; exit 1; }

      - name: API container as in docker-compose.yml (only its login file, read-only, workers not root)
        # The login file is root-only (0600) here: gunicorn's master reads it at start
        # (--preload), the workers serve as the user api (uid 2002).
        run: |
          d=$(mktemp -d)
          printf 'user=ci_reader\npassword=dummy\n' > "$d/api-db.properties"
          sudo chown root:root "$d/api-db.properties"
          sudo chmod 600 "$d/api-db.properties"
          docker run -d --name apitest --read-only --tmpfs /tmp --memory 1g --memory-swap 1g --cpus 1 \
            --pids-limit 200 --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -v "$d/api-db.properties:/antweb-etc/api-db.properties:ro" antweb/api:dev
          ok=0
          for i in $(seq 1 30); do
            if docker exec apitest curl -fsS http://localhost:5000/ 2>/dev/null | grep -q "Antweb API"; then ok=1; break; fi
            sleep 2
          done
          docker logs apitest 2>&1 | tail -20
          [ "$ok" = 1 ] || { echo "::error::API did not answer"; exit 1; }
          docker logs apitest 2>&1 | grep -q "API database user: ci_reader" || { echo "::error::API did not read its login file"; exit 1; }
          uids=$(docker exec apitest sh -c 'for s in /proc/[0-9]*/status; do awk "/^Uid:/{print \$2}" "$s"; done' | sort | uniq -c)
          echo "$uids"
          workers=$(echo "$uids" | awk '$2 == 2002 {print $1}')
          [ "${workers:-0}" -ge 3 ] || { echo "::error::gunicorn workers do not run as api (2002)"; exit 1; }
          docker rm -f apitest

      - name: Test Antweb Build
        run: |
          docker build -t antweb/antweb:dev -f docker/antweb/Dockerfile .

      - name: ImageMagick policy (TIFF/JPEG/PNG convert; risky formats refused)
        run: |
          docker run --rm --entrypoint sh -u tomcat -v "$PWD/tests/container:/t:ro" antweb/antweb:dev /t/imagemagick_policy_check.sh

      - name: Java unit tests of the 2026-10-18 hardening batch (in the antweb image)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/imageUploader/ImageUploaded.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/SecurityBatch7Test.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.SecurityBatch7Test > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (" /tmp/out.txt
          '

      - name: Java unit tests of image saving (one transaction, file name rules, genus default image) (2026-10-27)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/home/ImagePickDb.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/ImageUploadSaveTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.ImageUploadSaveTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (5 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the 2026-10-19 hardening (page.do redirect)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/PageAction.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/HardeningSmallFixesTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.HardeningSmallFixesTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (1 test)" /tmp/out.txt
            # Who may read upload files: the whole file (own group) and the line of one specimen (any curator, 2026-10-24).
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/UploadFileAccessTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.UploadFileAccessTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (3 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the EXIF section on the image page (Latin-1 and UTF-8 text, binary fields, escaping)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/util/ExifText.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/ExifTextTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.ExifTextTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (8 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the map popup data (locality names and codes encoded once, safe JavaScript strings)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/Map.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/maps/MapPopupDataTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.maps.MapPopupDataTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (2 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the limits on simultaneous maps, comparisons and field guides (ConcurrencyLimiter)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/util/ConcurrencyLimiter.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/ConcurrencyLimiterTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.ConcurrencyLimiterTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (5 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the species list of a search (names not identified to genus left out, B54)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/search/AdvancedSearchResults.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/search/SearchSpeciesListTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.search.SearchSpeciesListTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (3 tests)" /tmp/out.txt
          '

      - name: Map popups show decoded titles and link once-encoded codes (tests/unit/test_map_popups.py, runs drawMap.js in node)
        run: python3 tests/unit/test_map_popups.py

      - name: Java unit tests of the schema check (live database against doc/schema/live-schema-*.tsv)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/doc/schema:/s:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/util/SchemaCheck.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/SchemaCheckTest.java
            java -Dsnapshot.dir=/s -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.SchemaCheckTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (9 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the download guards (genus/species files, 5,000-record cap, paged search list)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/util/DownloadLimits.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/DownloadGuardsTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.DownloadGuardsTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (6 tests)" /tmp/out.txt
          '

      - name: Java unit tests of log growth (short message-page record, entry cap, log viewer cap, row limits, log size check) and the mount check
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/util/MessagePageLog.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/MessageLogTest.java /t/org/calacademy/antweb/util/MountCheckTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.MountCheckTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (" /tmp/out.txt
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.MessageLogTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (11 tests)" /tmp/out.txt
          '

      - name: Java unit tests of small core and util fixes (specimen XML without DOCTYPE, comparators, common names, folder delete keeps link targets)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/audit/CoreUtilFixesTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.audit.CoreUtilFixesTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (9 tests)" /tmp/out.txt
          '

      - name: Java unit tests of place and search fixes of 2026-10-28 (place links, place sorting, elevation box, date comparison, download names; PlacesSearchFixesTest)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/audit/PlacesSearchFixesTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.audit.PlacesSearchFixesTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (8 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the query string helper (results shown again, F26)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/HttpUtilQueryTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.HttpUtilQueryTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (2 tests)" /tmp/out.txt
          '

      - name: Java unit tests of the results shown again for a paged search (F25)
        run: |
