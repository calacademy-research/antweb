# Spend guard for the scheduled Claude audit (.github/workflows/claude-audit.yml, .github/scripts/claude_audit.py).
# Brian Fisher, 2026-10-29: the organization has promotional API credit only (no payment method). Keep twelve
# audits a day, but pause the audits by themselves when about $10 is left, so the cheap PR reviews keep running
# until the credit expires. The PR review (claude-review.yml) is never paused by this file.
#
# There is no API that gives the credit balance with the repository key, so each audit run writes its own cost
# (from the API's token counts) to ledger.tsv on the audit-reports branch, and the next run sums that ledger.
# PR reviews cannot write to that branch (their token is read-only), so the audit counts the Claude review runs
# since `start` and adds review_estimate dollars for each.
#
# To top up or reset: read the balance at console.anthropic.com (Settings, Billing), set start to the time you
# read it (UTC) and start_balance to the amount; ledger lines before start are then ignored.

[budget]
# When start_balance was read (UTC, ISO 8601).
start = 2026-10-29T19:00:00Z
# Credit left at that time, in US dollars (console, 2026-10-29 18:50 UTC).
start_balance = 59.87
# Audits pause when the estimated credit left is at or below this, in US dollars.
reserve = 10.00
# The credit expires on this day (UTC); no audit runs from then on. Change it only with new credit.
expires = 2026-11-08
# Estimated cost of one Claude review run, in US dollars (a deep review sends up to about 120,000 input tokens
# and gets up to 32,000 output tokens: at most about $1.12; most reviews are well below). Kept high on purpose.
# Since 2026-10-30 reviews and audits go through the Message Batches API at half price (a review at most about
# $0.56; audit ledger lines are written at the batch price). Left at 1.00 because the review runs counted since
# start include full-price ones; lower it (e.g. to 0.60) together with a new start and start_balance.
review_estimate = 1.00
