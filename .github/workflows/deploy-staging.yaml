name: Deploy Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

# One deploy at a time: two merges in a row started two deploys that ran git on the server at the same time,
# and the second failed with exit 128 (2026-10-23). A newer push waits for the running deploy; only the
# newest waiting one runs (it holds every earlier commit). tests/unit/test_deploy_paths.py checks this.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Host key check (2026-10-27): the server must answer with one of the keys pinned in .github/known_hosts
          # (public host keys of production, its reserved IP, and staging). Before, any key that answered was trusted.
          HOST="${{ secrets.STAGING_SSH_HOST }}"
          ssh-keyscan -t ed25519,ecdsa,rsa "$HOST" 2>/dev/null | awk '{print $2" "$3}' | sort -u > /tmp/scanned
          cut -d" " -f2,3 .github/known_hosts | sort -u > /tmp/pinned
          if [ -z "$(comm -12 /tmp/scanned /tmp/pinned)" ]; then
            echo "::error::The server did not answer with a pinned host key (.github/known_hosts). Deploy stopped."
            exit 1
          fi
          comm -12 /tmp/scanned /tmp/pinned | sed "s|^|$HOST |" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        run: ssh -o StrictHostKeyChecking=yes ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} 'DEPLOY_BRANCH=staging bash -s' < .github/scripts/deploy.sh
