name: Tests

on:
  pull_request:
    branches:
      - master

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Version number matches (.version and the site header)
        run: |
          v=$(tr -d '[:space:]' < .version)
          grep -q "antwebRelease = \"$v\"" web/documentation/releaseNum.jsp \
            || { echo "::error::.version is $v but web/documentation/releaseNum.jsp differs"; exit 1; }

      - name: Test Caddy Build
        run: |
          cd docker/caddy
          docker build -t antweb/caddy:dev .

      - name: Check Caddyfiles (prod and staging)
        run: |
          for f in Caddyfile Caddyfile.staging; do
            docker run --rm -v "$PWD/docker/caddy:/etc/caddy:ro" antweb/caddy:dev \
              caddy adapt --config /etc/caddy/$f --adapter caddyfile > /dev/null && echo "$f OK"
          done

      - name: JSP allow-list is the same in Caddyfile and Caddyfile.common
        run: python3 tests/e2e/caddy_lists.py

      - name: Function catalog has a row for every action
        # Regenerates the catalog in memory and fails when a Struts action or sub-action has no
        # row in docs/catalog/actions.csv. Fix: python3 tools/catalog/build_catalog.py, fill in
        # purpose and status of the new rows, commit docs/catalog/ (see docs/README.md).
        run: python3 tools/catalog/build_catalog.py --check

      - name: Test API Build
        run: |
          docker build -t antweb/api:dev -f docker/api/Dockerfile .

      - name: Compose files are valid (prod and staging)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.stage.yml config -q

      - name: API limits and streamed ndjson (tests/unit/test_api_limits.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" antweb/api:dev /t/test_api_limits.py

      - name: API refuses unknown parameters, code and rank aliases, documented examples (tests/unit/test_api_params.py)
        run: |
          docker run --rm --entrypoint python -v "$PWD/tests/unit:/t:ro" -v "$PWD/web/documentation/api:/docs:ro" \
            antweb/api:dev /t/test_api_params.py

      - name: API container as in docker-compose.yml (only its login file, read-only, workers not root)
        # The login file is root-only (0600) here: gunicorn's master reads it at start
        # (--preload), the workers serve as the user api (uid 2002).
        run: |
          d=$(mktemp -d)
          printf 'user=ci_reader\npassword=dummy\n' > "$d/api-db.properties"
          sudo chown root:root "$d/api-db.properties"
          sudo chmod 600 "$d/api-db.properties"
          docker run -d --name apitest --read-only --tmpfs /tmp --memory 1g --memory-swap 1g --cpus 1 \
            --pids-limit 200 --security-opt no-new-privileges:true --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            -v "$d/api-db.properties:/antweb-etc/api-db.properties:ro" antweb/api:dev
          ok=0
          for i in $(seq 1 30); do
            if docker exec apitest curl -fsS http://localhost:5000/ 2>/dev/null | grep -q "Antweb API"; then ok=1; break; fi
            sleep 2
          done
          docker logs apitest 2>&1 | tail -20
          [ "$ok" = 1 ] || { echo "::error::API did not answer"; exit 1; }
          docker logs apitest 2>&1 | grep -q "API database user: ci_reader" || { echo "::error::API did not read its login file"; exit 1; }
          uids=$(docker exec apitest sh -c 'for s in /proc/[0-9]*/status; do awk "/^Uid:/{print \$2}" "$s"; done' | sort | uniq -c)
          echo "$uids"
          workers=$(echo "$uids" | awk '$2 == 2002 {print $1}')
          [ "${workers:-0}" -ge 3 ] || { echo "::error::gunicorn workers do not run as api (2002)"; exit 1; }
          docker rm -f apitest

      - name: Test Antweb Build
        run: |
          docker build -t antweb/antweb:dev -f docker/antweb/Dockerfile .

      - name: ImageMagick policy (TIFF/JPEG/PNG convert; risky formats refused)
        run: |
          docker run --rm --entrypoint sh -u tomcat -v "$PWD/tests/container:/t:ro" antweb/antweb:dev /t/imagemagick_policy_check.sh

      - name: Java unit tests of the 2026-10-18 hardening batch (in the antweb image)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/imageUploader/ImageUploaded.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/SecurityBatch7Test.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.SecurityBatch7Test
          '

      - name: Java unit tests of the 2026-10-19 hardening (page.do redirect)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/PageAction.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/HardeningSmallFixesTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.HardeningSmallFixesTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (1 test)" /tmp/out.txt
          '

      - name: Java unit tests of the EXIF section on the image page (Latin-1 and UTF-8 text, binary fields, escaping)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/util/ExifText.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/util/ExifTextTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.util.ExifTextTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (8 tests)" /tmp/out.txt
          '

      - name: Java unit tests of upload and scheduler hardening (zip extraction, nightly self-calls)
        # SafeUnzip (symlink, .., size and entry caps, picks the right entry), specimen header
        # checks, species list deletion, image upload reports, and SchedulerCall: the nightly
        # Scheduler's request as HttpUtil sends it is accepted, a code in the query string refused.
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/upload/SafeUnzip.class
            test -f $C/org/calacademy/antweb/util/SchedulerCall.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/UploadSchedulerHardeningTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.UploadSchedulerHardeningTest
          '

      - name: Java unit tests of the Curate page cleanup (named queries, developer role, museum recount, site warning)
        # Queries reads AntwebResources/platform properties: the staging settings are put on the classpath.
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/CurateCleanupTest.java
            # AntwebProps ends the JVM with status 0 when a settings file is missing: require the summary line.
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.CurateCleanupTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (7 tests)" /tmp/out.txt
          '

      - name: Java unit tests of email texts and reset links (no "ignore this email"; opening a link uses nothing up)
        # EmailLinkTest renders every email text, and runs resetPassword.do's logic against an
        # in-memory database: GET twice changes nothing, only the POST that sets a password uses the token.
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/EmailLinkTest.java
            # AntwebProps ends the JVM with status 0 when a settings file is missing: require the summary line.
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.EmailLinkTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (4 tests)" /tmp/out.txt
          '

      - name: Java unit tests of uploads and the nightly TaxonWorks job (transform fixture, job decisions, name rule, nightly name update, password hash)
        # TaxonWorksTransformFixtureTest: test/.../upload/fixtures/taxonworks-data.tsv through the
        # TaxonWorks transform. TaxonWorksNightlyDecisionsTest: wait/skip decisions, one run at a
        # time, no settings file. NameResolutionRuleTest: statuses that use the current valid name,
        # indet and morpho names. SpecimenNameUpdateTest: the upload's name rule with a fake taxon table
        # and the nightly name update's decisions, cap, settings and page line. AntcatHistoryTest: AntCat's
        # taxonomic history (fixtures/antcat-history.tsv) and the wording of each move's reason. SharedNamesTest: names
        # of two or more AntCat taxa (fixtures/antcat-shared-names.tsv), held for the curator. SharedNameReportTest: the
        # upload report and the Name updates page give the same "Needs the curator's decision" line (one code path; homonyms included). PasswordHashCompatTest: hashes made by
        # tools/staging/create-test-accounts.py are accepted. UploadNameReasonsTest: the upload report's "Recognized
        # invalid species" lines carry the Name updates page's reason (once per pair, plain line on failure), and the
        # page's "Not moved: filed under a name AntCat calls valid" list. UploadAsOptionsTest: the Curate page's
        # "Upload as" list names the group each upload replaces. BackgroundJobsTest: uploads and admin jobs in the
        # background (status changes, one at a time, a second upload goes to the first, waiting while busy,
        # interrupted after a restart, who sees a job). UploadReportExistsTest: the upload lists link a report
        # only while it exists, and each upload's file through uploadFile.do. SpecimenNameHistoryTest: the specimen page's
        # Name History section (applied moves only, newest first, the Name updates page's line and reason, uploaded name,
        # shared-name hold, previous determinations, escaping, nothing when empty). See docs/flows/test-gaps-uploads-nightly.md.
        # only while it exists, and each upload's file through uploadFile.do. SpecimenCodesTest: "N specimens" and the
        # collapsed list of codes on every upload report line and on the Name updates page (one helper; count, cap of
        # 200 per line and 10,000 per report, escaping, plain codes for lines not uploaded). RelevantQueriesTest: the
        # Relevant Queries boxes of viewGroups.do and viewLogins.do explain each query; headings match the columns.
        # See docs/flows/test-gaps-uploads-nightly.md.
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" -v "$PWD/web:/web:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc \
              /t/org/calacademy/antweb/upload/TaxonWorksTransformFixtureTest.java \
              /t/org/calacademy/antweb/upload/TaxonWorksNightlyDecisionsTest.java \
              /t/org/calacademy/antweb/upload/NameResolutionRuleTest.java \
              /t/org/calacademy/antweb/upload/SpecimenNameUpdateTest.java \
              /t/org/calacademy/antweb/upload/AntcatHistoryTest.java \
              /t/org/calacademy/antweb/upload/SharedNamesTest.java \
              /t/org/calacademy/antweb/upload/SharedNameReportTest.java \
              /t/org/calacademy/antweb/upload/UploadNameReasonsTest.java \
              /t/org/calacademy/antweb/upload/SpecimenNameHistoryTest.java \
              /t/org/calacademy/antweb/curate/UploadAsOptionsTest.java \
              /t/org/calacademy/antweb/upload/UploadReportExistsTest.java \
              /t/org/calacademy/antweb/security/PasswordHashCompatTest.java \
              /t/org/calacademy/antweb/util/BackgroundJobsTest.java \
              /t/org/calacademy/antweb/util/SpecimenCodesTest.java \
              /t/org/calacademy/antweb/util/RelevantQueriesTest.java
            for t in upload.TaxonWorksTransformFixtureTest:10 upload.TaxonWorksNightlyDecisionsTest:7 \
                     upload.NameResolutionRuleTest:6 upload.SpecimenNameUpdateTest:18 \
                     upload.AntcatHistoryTest:19 upload.SharedNamesTest:5 upload.SharedNameReportTest:6 security.PasswordHashCompatTest:2 \
                     util.BackgroundJobsTest:14 upload.UploadNameReasonsTest:6 curate.UploadAsOptionsTest:4 \
                     upload.UploadReportExistsTest:3 upload.SpecimenNameHistoryTest:9; do
                     upload.UploadReportExistsTest:3 util.SpecimenCodesTest:6 util.RelevantQueriesTest:2; do
              cls=${t%%:*}; n=${t##*:}
              # AntwebProps ends the JVM with status 0 when a settings file is missing: require the summary line.
              java -Dantweb.test=/t -Dantweb.web=/web -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.$cls > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
              grep -v "LogMgr" /tmp/out.txt | tail -3
              grep -q "^OK ($n tests)" /tmp/out.txt || { cat /tmp/out.txt; echo "::error::$cls"; exit 1; }
            done
          '

      - name: Staging test accounts tool (tests/unit/test_staging_accounts.py)
        run: python3 tests/unit/test_staging_accounts.py

      - name: No email tells the reader to ignore it (tests/unit/test_email_texts.py)
        run: python3 tests/unit/test_email_texts.py

      - name: Login updates keep login.created, no delete of all page text, page titles, admin links on phones (tests/unit/test_small_fixes.py)
        run: python3 tests/unit/test_small_fixes.py

      - name: Tomcat connector allows many Accept-Language entries (maxLocaleCount)
        run: grep -q 'maxLocaleCount="100"' docker/antweb/tomcat/conf/server.xml
      - name: Database tests against MySQL 8.4 (Pacific dates in the connection pools; curator species-list rows kept; name update; count check; place image counts; region counts; place renames keep page text)
        # DbTimeZoneTest: dates written by MySQL and by Java read back as the same moment and are
        # stored as Pacific wall-clock time, for conPool, mediumConPool and longConPool.
        run: |
          ! grep -rnE "jdbc:mysql[^\"]*serverTimezone" WEB-INF src --include=*.xml --include=*.java || { echo "::error::serverTimezone in a JDBC URL (use connectionTimeZone=LOCAL)"; exit 1; }
          cmp WEB-INF/struts-configDbAnt.xml WEB-INF/struts-configDb.xml
          docker network create tzcheck
          docker run -d --name mysql --network tzcheck -e TZ=America/Los_Angeles -e MYSQL_ROOT_PASSWORD=ci-root \
            -e MYSQL_DATABASE=ant -e MYSQL_USER=antweb -e MYSQL_PASSWORD=CHANGE_ME \
            -v "$PWD/docker/mysql/mysql.cnf:/etc/mysql/conf.d/custom.cnf:ro" mysql:8.4 --mysql-native-password=ON
          ok=0
          for i in $(seq 1 90); do
            if docker exec mysql mysql -uroot -pci-root -h127.0.0.1 -e "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs mysql 2>&1 | tail -30; echo "::error::MySQL did not start"; exit 1; }
          # As in production: the antweb login uses mysql_native_password (the driver does not use SSL).
          docker exec mysql mysql -uroot -pci-root -h127.0.0.1 -e "ALTER USER 'antweb'@'%' IDENTIFIED WITH mysql_native_password BY 'CHANGE_ME'"
          docker run --rm --network tzcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/WEB-INF:/w:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/DbTimeZoneTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.DbTimeZoneTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (4 tests)" /tmp/out.txt
          '
          # CuratorTaxonSetTest: curator rows of region and project species lists survive the
          # nightly cleanup (parked in taxon_set_parked, restored when the name exists again).
          docker run --rm --network tzcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/home/CuratorTaxonSetTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.home.CuratorTaxonSetTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            grep -v "LogMgr" /tmp/out.txt | tail -5
            grep -q "^OK (6 tests)" /tmp/out.txt
          '
          # SpecimenNameUpdateDbTest: the nightly name update (report, apply, cap, parked list entries, names kept on a
          # valid name), the upload report's reason read from the same tables, and the same shared-name line in the
          # upload report and on the page.
          # CountCheckTest: list counts against a recount from specimens (real and pending differences).
          # PlaceImageCountDbTest: Images, images per view and Imaged specimens of places (labels apart),
          # per-taxon image counts of a place, and the count check of those numbers.
          # RegionCountDbTest: region and subregion numbers count the specimens of their countries only.
          # BackgroundJobDbTest: the background_job table (status pages of uploads and admin jobs; interrupted at start-up).
          # PageTextRenameDbTest: renaming a place (editGeolocale.do) moves its page text and history (object_edit,
          # object_hist) with their dates; a new name that has page text already is refused and nothing changes.
          # SpecimenNameHistoryDbTest: the specimen page's Name History query (applied rows of one specimen, newest first,
          # never report-only rows; index by_code; no history when the table is missing).
          docker run --rm --network tzcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc \
              /t/org/calacademy/antweb/upload/SpecimenNameUpdateDbTest.java /t/org/calacademy/antweb/util/CountCheckTest.java \
              /t/org/calacademy/antweb/home/PlaceImageCountDbTest.java /t/org/calacademy/antweb/util/BackgroundJobDbTest.java \
              /t/org/calacademy/antweb/home/RegionCountDbTest.java /t/org/calacademy/antweb/home/PageTextRenameDbTest.java \
              /t/org/calacademy/antweb/upload/SpecimenNameHistoryDbTest.java
            for t in upload.SpecimenNameUpdateDbTest:12 util.CountCheckTest:7 home.PlaceImageCountDbTest:5 util.BackgroundJobDbTest:4 home.RegionCountDbTest:4 home.PageTextRenameDbTest:7 upload.SpecimenNameHistoryDbTest:5; do
              cls=${t%%:*}; n=${t##*:}
              java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.$cls > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; grep -E "^[0-9]+\) |^Caused by|Exception:" /tmp/out.txt | head -6 | sed "s/^/::error::$cls: /"; exit 1; }
              grep -v "LogMgr" /tmp/out.txt | tail -3
              grep -q "^OK ($n tests)" /tmp/out.txt || { cat /tmp/out.txt; echo "::error::$cls"; exit 1; }
            done
          '
          docker rm -f mysql

      - name: Java unit tests of the admin report pages (-D part codes, parts report, explanation boxes)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/etc:/e:ro" \
            -v "$PWD/docker/antweb/platform.properties:/p/platform.properties:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/res /tmp/tc
            cp /e/AppResStageDocker.properties /tmp/res/AntwebResources.properties
            cp /p/platform.properties /tmp/res/
            CP="/tmp/res:$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/security/ReportsTest.java
            java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.security.ReportsTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (5 tests)" /tmp/out.txt
          '

      - name: Add an uploader and the login form (input checks, welcome email, page; database steps against MySQL 8.4)
        # UploaderOnboardingTest: the form's checks, the welcome email text (escaped, no "ignore"), and
        # which refused POSTs are shown again filled in (Csrf.mayRefill: stale token on addUploader.do only).
        # UploaderOnboardingDbTest: new person and new upload group, existing account by email or
        # username, moving only when asked, refusals change nothing, login.created kept, inactive
        # accounts get a link, a group with logins or specimens is not deleted.
        # LoginEditTest: the login form (sections, escaping, admin warning, own admin rights locked,
        # upload group list, add boxes, change summary). LoginEditDbTest: an administrator's save in
        # one step, refused values change nothing, old assignments kept, delete removes assignments.
        # LoginIdDbTest: a new login never gets a number used before (deleted logins, curator folders,
        # login numbers in other tables); password reset steps keep login.created; the upgrade script
        # db/upgrade/8.113/2026-10-21-login-created.sql removes ON UPDATE from login.created.
        run: |
          docker network create ugcheck
          docker run -d --name ugmysql --network ugcheck -e MYSQL_ROOT_PASSWORD=ci-root \
            -e MYSQL_DATABASE=ant -e MYSQL_USER=antweb -e MYSQL_PASSWORD=CHANGE_ME mysql:8.4 --mysql-native-password=ON
          ok=0
          for i in $(seq 1 90); do
            if docker exec ugmysql mysql -uroot -pci-root -h127.0.0.1 -e "select 1" >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker logs ugmysql 2>&1 | tail -30; echo "::error::MySQL did not start"; exit 1; }
          docker exec ugmysql mysql -uroot -pci-root -h127.0.0.1 -e "ALTER USER 'antweb'@'%' IDENTIFIED WITH mysql_native_password BY 'CHANGE_ME'"
          docker run --rm --network ugcheck --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/db:/d:ro" \
            -e ANTWEB_TEST_DB_URL="jdbc:mysql://ugmysql:3306/ant?useSSL=false&allowPublicKeyRetrieval=true" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            test -f $C/org/calacademy/antweb/curate/group/UploaderOnboarding.class
            test -f $C/org/calacademy/antweb/curate/login/LoginEdit.class
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            mkdir -p /tmp/tc
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc \
              /t/org/calacademy/antweb/curate/UploaderOnboardingTest.java /t/org/calacademy/antweb/curate/UploaderOnboardingDbTest.java \
              /t/org/calacademy/antweb/curate/LoginEditTest.java /t/org/calacademy/antweb/curate/LoginEditDbTest.java \
              /t/org/calacademy/antweb/curate/LoginIdDbTest.java
            for t in curate.UploaderOnboardingTest:6 curate.UploaderOnboardingDbTest:10 curate.LoginEditTest:10 curate.LoginEditDbTest:6 curate.LoginIdDbTest:8; do
              cls=${t%%:*}; n=${t##*:}
              java -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.$cls > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; grep -E "^[0-9]+\) |^Caused by|Exception:" /tmp/out.txt | head -6 | sed "s/^/::error::$cls: /"; exit 1; }
              grep -v "LogMgr" /tmp/out.txt | tail -3
              grep -q "^OK ($n tests)" /tmp/out.txt || { cat /tmp/out.txt; echo "::error::$cls"; exit 1; }
            done
          '
          docker rm -f ugmysql

      - name: Java unit tests of the image picker (taxon name properties, Pick buttons not inside another form)
        run: |
          docker run --rm --entrypoint sh -v "$PWD/test:/t:ro" -v "$PWD/web:/w:ro" antweb/antweb:dev -c '
            set -e
            C=/usr/local/antweb/WEB-INF/classes
            mkdir -p /tmp/tc
            CP="$C:/usr/local/antweb/WEB-INF/lib/*:/usr/local/tomcat/lib/*:/t/lib/junit-4.12.jar"
            javac -nowarn -encoding UTF-8 -proc:none -cp "$CP" -d /tmp/tc /t/org/calacademy/antweb/ImagePickerTest.java
            java -Dantweb.web=/w -cp "/tmp/tc:$CP" junit.textui.TestRunner test.org.calacademy.antweb.ImagePickerTest > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; exit 1; }
            cat /tmp/out.txt
            grep -q "^OK (4 tests)" /tmp/out.txt
          '

      - name: clearDisk.py skips web/log and links (tests/unit/test_clear_disk.py)
        run: python3 tests/unit/test_clear_disk.py

      - name: deploy.sh no-restart list (tests/unit/test_deploy_paths.py)
        run: python3 tests/unit/test_deploy_paths.py

      - name: web/log on a host folder (report links, tomcat writes, log rotation)
        # web/log is a host folder in production (docker-compose.yml: ./logs/web). Starting
        # from an empty one, antweb-fix-perms must make the four upload report links into
        # the bucket and give the folder to tomcat; logrotate (as tomcat) must rotate a big
        # log, leave small files and the report folders alone.
        run: |
          d=$(mktemp -d)
          docker run --rm --entrypoint sh -v "$d:/usr/local/antweb/web/log" antweb/antweb:dev -c '
            set -e
            L=/usr/local/antweb/web/log
            /usr/local/bin/antweb-fix-perms
            for r in specimen worldants detail upload; do
              test "$(readlink $L/$r)" = "/mnt/antweb/web/log/$r" || { echo "missing link $L/$r"; exit 1; }
            done
            /usr/local/bin/antweb-fix-perms   # a second start changes nothing and warns about nothing
            T="setpriv --reuid=tomcat --regid=antweb --init-groups"
            $T sh -c "head -c 11000000 /dev/zero > $L/compute.log; echo flag > $L/siteWarning.txt"
            # As if both files were last rotated long ago: only the one over 10 MB is due.
            printf "logrotate state -- version 2\n\"$L/compute.log\" 2026-1-1-0:0:0\n\"$L/siteWarning.txt\" 2026-1-1-0:0:0\n" > /tmp/s
            chown tomcat /tmp/s
            $T /usr/sbin/logrotate --state /tmp/s /etc/antweb-logrotate.conf
            ls -la $L
            ls $L | grep -q "^compute.log-[0-9]\{8\}$" || { echo "compute.log was not rotated"; exit 1; }
            test -f $L/siteWarning.txt || { echo "small file was rotated"; exit 1; }
            for r in specimen worldants detail upload; do test -L $L/$r; done
            grep -q "logrotate" /etc/cron.d/antwebcrontab
          '

  java-compile:
    # Compiles every Java source against the jars in WEB-INF/lib and the
    # servlet/JSP APIs of the same Tomcat image production runs, so a change
    # that does not compile is caught on the pull request, not at deploy.
    runs-on: ubuntu-latest
    container: tomcat:11-jdk21

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile
        run: |
          find src -name '*.java' > /tmp/sources.txt
          mkdir -p /tmp/classes
          javac -nowarn -encoding UTF-8 -proc:none \
            -cp "WEB-INF/lib/*:/usr/local/tomcat/lib/*" \
            -d /tmp/classes @/tmp/sources.txt
          echo "Compiled $(wc -l < /tmp/sources.txt) source files" >> "$GITHUB_STEP_SUMMARY"
