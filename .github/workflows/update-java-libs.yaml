# One-time helper (2026-10-13): c3p0 0.9.1.2 -> 0.9.5.5, gson 2.8.0 -> 2.11.0.
# Fetch from Maven Central, verify SHA-1, build the image (full ant compile), run the unit tests, commit.
# Delete before merging.
name: Update Java libs (one-time)
on:
  push:
    branches: [chore/antweb-housekeeping]
    paths: [.github/workflows/update-java-libs.yaml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify jars
        run: |
          set -euo pipefail
          M=https://repo1.maven.org/maven2; cd WEB-INF/lib
          get() { f=$(basename "$1"); curl -fsSL -o "$f" "$M/$1"; want=$(curl -fsSL "$M/$1.sha1" | cut -c1-40); got=$(sha1sum "$f" | cut -c1-40); [ "$want" = "$got" ] || { echo "SHA-1 mismatch $f"; exit 1; }; echo "OK $f $got"; }
          get com/mchange/c3p0/0.9.5.5/c3p0-0.9.5.5.jar
          get com/google/code/gson/gson/2.11.0/gson-2.11.0.jar
          git rm -q c3p0-0.9.1.2.jar gson-2.8.0.jar
      - name: Build AntWeb image (compiles all code)
        run: set -o pipefail; docker build -f docker/antweb/Dockerfile -t aw . 2>&1 | tail -20
      - name: Compile and run unit tests (outside the web app)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD":/w -w /w --entrypoint sh aw -c 'ant compile-tests && ant test' > t.log 2>&1; rc=$?
          grep -E "Tests run|BUILD|error:|Error|FAILED|Exception" t.log | head -15 | while IFS= read -r l; do echo "::notice title=ant test::$l"; done
          echo "::notice title=ant test exit::$rc"
          rm -f t.log; sudo rm -rf build build-test
      - name: Commit jars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WEB-INF/lib
          git commit -m "c3p0 0.9.1.2 -> 0.9.5.5, gson 2.8.0 -> 2.11.0"
          git push origin HEAD:chore/antweb-housekeeping
