# Scheduled Claude audit of the code, one area per run (Brian Fisher, 2026-10-23: use the Anthropic API
# credit before it expires on 2026-11-08). Script: .github/scripts/claude_audit.py.
# The repository is public: the report is encrypted for .github/audit-recipient.pem and uploaded as an
# artifact; the job summary shows only the area, size, tokens and estimated cost. Scheduled runs stop
# by themselves after 2026-11-07. Run one area by hand: Actions, "Claude audit", Run workflow, area name.
# Spend guard (2026-10-29): every audit, scheduled or by hand, first estimates the API credit left from
# .github/audit-budget.ini, ledger.tsv on the audit-reports branch (the cost of each audit) and the number of
# Claude review runs, and pauses (green run, reason in the job summary) at or below the reserve or after expiry.
name: Claude audit

on:
  schedule:
    # Twelve runs a day since 2026-10-24 (Brian Fisher: use the credit; four before). The UTC hours below must
    # match SLOT_HOURS; away from the nightly (12:00-15:30 UTC) and the daily end-to-end run (20:17 UTC).
    - cron: "10 0 * * *"
    - cron: "10 1 * * *"
    - cron: "10 2 * * *"
    - cron: "10 4 * * *"
    - cron: "10 5 * * *"
    - cron: "10 6 * * *"
    - cron: "10 8 * * *"
    - cron: "10 9 * * *"
    - cron: "10 10 * * *"
    - cron: "10 17 * * *"
    - cron: "10 18 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      area:
        description: "Area to audit (e.g. upload-1; empty = next in the rotation)"
        required: false
        default: ""

permissions:
  contents: write   # to push the encrypted report and the ledger line to the audit-reports branch
  actions: read     # to count the Claude review runs for the spend estimate

concurrency:
  group: claude-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check that the API key secret exists
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY secret is not set; skipping the audit."
          fi

      - name: Checkout master
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 1

      - name: Checkout AntCat (public) into ./antcat, for the AntCat areas of the rotation
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          repository: calacademy-research/antcat
          ref: master
          path: antcat
          fetch-depth: 1
          persist-credentials: false

      # The ledger file is left missing when the branch exists but cannot be fetched; the script then pauses
      # the audit (spend unknown). No branch yet, or no ledger on it yet, means nothing spent: an empty ledger.
      - name: Read the spend ledger from the audit-reports branch
        if: steps.key.outputs.present == 'true'
        run: |
          ledger="$RUNNER_TEMP/ledger.tsv"
          if git ls-remote --exit-code --heads origin audit-reports >/dev/null 2>&1; then
            if git fetch -q --depth 1 origin audit-reports; then
              git show FETCH_HEAD:ledger.tsv > "$ledger" 2>/dev/null || : > "$ledger"
            else
              echo "::warning::Could not fetch audit-reports; the audit will pause."
            fi
          else
            : > "$ledger"
          fi
          if [ -f "$ledger" ]; then echo "Ledger: $(grep -vc '^#' "$ledger" || true) lines"; fi

      - name: Audit one area
        if: steps.key.outputs.present == 'true'
        timeout-minutes: 18
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          LEDGER: ${{ runner.temp }}/ledger.tsv
          AREA: ${{ github.event.inputs.area }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT_HOURS: "0,1,2,4,5,6,8,9,10,17,18,22"
          OUT: audit-out
        run: python3 .github/scripts/claude_audit.py

      # The encrypted report goes to the branch audit-reports (no code, one file per run), where the key holder
      # reads it with git; artifacts are stored on a host this project's session cannot reach. Encrypted, so it
      # can sit in a public repository. The run's cost line is appended to ledger.tsv there (also when a later
      # step failed: the request was paid). Audits never run two at a time (concurrency group), so a push can
      # only race another branch writer by hand; it is retried on a fresh copy of the branch.
      - name: Push the encrypted report and the ledger line to the audit-reports branch
        if: always() && steps.key.outputs.present == 'true' && hashFiles('audit-out/*.cms', 'audit-out/ledger-line.tsv') != ''
        run: |
          set -e
          git config user.name "claude-audit"
          git config user.email "claude-audit@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            if git ls-remote --exit-code --heads origin audit-reports >/dev/null 2>&1; then
              git fetch -q --depth 1 origin audit-reports
              git switch -q -C audit-reports FETCH_HEAD
            else
              git switch -q --orphan audit-reports
              git rm -rq --cached . >/dev/null 2>&1 || true
              git clean -fdqx -e audit-out
              printf 'Encrypted Claude audit reports (see .github/workflows/claude-audit.yml on master). No code here.\n' > README.md
              git add README.md
            fi
            if ls audit-out/*.cms >/dev/null 2>&1; then
              mkdir -p reports
              cp audit-out/*.cms reports/
              git add reports
            fi
            if [ -f audit-out/ledger-line.tsv ]; then
              [ -s ledger.tsv ] || printf '# utc_time\trun_id\tkind\tcost_usd\tnote (spend ledger: .github/audit-budget.ini on master)\n' > ledger.tsv
              cat audit-out/ledger-line.tsv >> ledger.tsv
              git add ledger.tsv
            fi
            git commit -qm "Claude audit report ${GITHUB_RUN_ID}"
            if git push -q origin audit-reports; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); retrying on a fresh copy of the branch."
            git reset -q --hard
            sleep $((attempt * 5))
          done
          echo "::error::Could not push to audit-reports; this run's cost is not in the ledger."
          exit 1
