services:
  mysql:
    container_name: antweb_mysql_1
    restart: unless-stopped
    image: mysql:8.4
    # 8.4 removed --default-authentication-plugin; keep the existing mysql_native_password logins working
    command: "--mysql-native-password=ON"

    volumes:
      - ./docker/mysql/mysql.cnf:/etc/mysql/conf.d/custom.cnf
      - antweb_database84:/var/lib/mysql
    environment:
      TZ: America/Los_Angeles
#      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    expose:
      - 3306
    ports:
      - "127.0.0.1:3306:3306"

  caddy:
    container_name: antweb_caddy_1
    build:
      context: .
      dockerfile: docker/caddy/Dockerfile
#    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/Caddyfile.common:/etc/caddy/Caddyfile.common:ro
      - ./docker/caddy/logs:/var/log/caddy

      - antweb_caddy_data:/data
      - caddy_config:/config

    environment:
      IMAGE_BUCKET_DOMAIN: 'https://static.antweb.org'

  api:
    container_name: antweb_api_1
    build:
      context: .
      dockerfile: docker/api/Dockerfile

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 1m

    depends_on:
      - mysql
      
    restart: unless-stopped
    expose:
      - 5000

    # etc/api-db.properties (not in git) holds the API's read-only database login.
    volumes:
      - ./etc:/antweb-etc:ro

  antweb:
    container_name: antweb_antweb_1
    build:
      context: .
      dockerfile: docker/antweb/Dockerfile
      args:
        ENV: PROD
    restart: unless-stopped
    hostname: antweb
    expose:
      - 8009
    ports:
      - "127.0.0.1:8081:8080"   # expose manager interface to local machine for monitoring
    environment:
      CATALINA_OPTS: "-XX:MaxRAMPercentage=40 -server -XX:+UseParallelGC"
    extra_hosts:
      - "antweb.org:127.0.0.1"
      - "www.antweb.org:127.0.0.1"

    # Mount the s3fs bucket for serving files
    volumes:
      - ${ANTWEB_BUCKET_PATH:-/mnt/antweb}:/mnt/antweb
      - ${ANTWEB_BACKUP_PATH:-/mnt/backup}:/mnt/backup
      - ./logs:/usr/local/tomcat/logs
      - ./logbak:/usr/local/antweb/log/
      - antweb_genInc:/usr/local/antweb/web/genInc

      # Code and settings are read-only inside the container: ant deploy only reads
      # them (it writes to build/ and /usr/local/antweb), so code running in Tomcat
      # cannot change the checkout on the host.
      - ./build.xml:/antweb/deploy/build.xml:ro
      - ./bin:/antweb/deploy/bin:ro
      - ./doc:/antweb/deploy/doc:ro
      - ./etc:/antweb/deploy/etc:ro
      - ./META-INF:/antweb/deploy/META-INF:ro
      - ./src:/antweb/deploy/src:ro
      - ./test:/antweb/deploy/test:ro
      - ./web:/antweb/deploy/web:ro
      - ./WEB-INF:/antweb/deploy/WEB-INF:ro

    # No process in the container may gain privileges (setuid binaries), and root in
    # the container keeps only the capabilities cron and Tomcat need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - KILL
      - AUDIT_WRITE

    logging:      # only store the last 50mb of logs. more may be captured in the mounted logs/ dir
      driver: "json-file"
      options:
        max-file: '5'
        max-size: '10m'

volumes:
  antweb_genInc:
  antweb_database:     # MySQL 5.7 data, kept for rollback (2026-10)
    external: true
  antweb_database84:   # MySQL 8.4 data (create with: docker volume create antweb_database84)
    external: true
  caddy_config:   # Don't need to prefix with antweb_ since it's an internal volume, docker-compose will do it automatically
  antweb_caddy_data:
    external: true
